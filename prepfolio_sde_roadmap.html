const KEY='prepfolio-interview-v1';const EMPTY=()=>({version:1,problems:{},patterns:{},core:{},backend:{},plan:{},applications:[],theme:'dark'});let state=EMPTY(), storageOK=true;try{const saved=localStorage.getItem(KEY);if(saved)state=normalize(JSON.parse(saved));}catch(e){storageOK=false;}
function normalize(s){if(!s||s.version!==1||!s.problems||!s.patterns||!s.core)throw Error('Not a Prepfolio backup');const out=EMPTY();for(const k of ['problems','patterns','core','backend']){if(k==='backend'&&s[k]===undefined)continue;if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))throw Error('Invalid backup');for(const [id,v] of Object.entries(s[k])){if(!/^[dcb]\d+(?:p\d+|-\d+)?$/.test(id))continue;if(k==='patterns'){out[k][id]=v===true;continue}if(!v||typeof v!=='object')continue;out[k][id]={status:['Not started','Attempted','Solved','Needs revision','Studied'].includes(v.status)?v.status:'Not started',date:/^\d{4}-\d{2}-\d{2}$/.test(v.date||'')?v.date:'',minutes:String(v.minutes??'').slice(0,10),hints:String(v.hints??'').slice(0,20),confidence:['1','2','3','4','5'].includes(String(v.confidence))?String(v.confidence):'',notes:String(v.notes??'').slice(0,20000),reviews:Array.isArray(v.reviews)?v.reviews.filter(x=>[2,7,21].includes(x)):[]};}}if(s.plan&&typeof s.plan==='object'&&!Array.isArray(s.plan)){for(const [id,v] of Object.entries(s.plan)){if(/^plan-[a-z0-9-]+$/.test(id)&&v===true)out.plan[id]=true}}if(Array.isArray(s.applications))out.applications=s.applications.slice(0,1000).filter(x=>x&&typeof x==='object').map(x=>({company:String(x.company||'').slice(0,200),role:String(x.role||'').slice(0,200),url:String(x.url||'').slice(0,1000),date:/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')?x.date:'',status:['Wishlist','Applied','Referral requested','OA','Interview','Offer','Rejected','Closed'].includes(x.status)?x.status:'Wishlist',notes:String(x.notes||'').slice(0,4000)}));out.theme=s.theme==='light'?'light':'dark';return out;}
const $=s=>document.querySelector(s);const app=$('#app');const problems=DATA.dsa.flatMap(t=>t.patterns.flatMap(p=>p.problems.map(x=>({...x,topic:t.name,pattern:p.name,topicId:t.id,patternId:p.id}))));const patterns=DATA.dsa.flatMap(t=>t.patterns);const cores=DATA.core.flatMap(t=>t.topics.map(x=>({...x,subject:t.name,priority:t.priority,subjectId:t.id})));const backends=DATA.backend.flatMap(t=>t.topics.map(x=>({...x,subject:t.name,priority:t.priority,subjectId:t.id,url:t.url})));const backendMap=new Map(backends.map(x=>[x.id,x]));const problemMap=new Map(problems.map(p=>[p.id,p]));const coreMap=new Map(cores.map(c=>[c.id,c]));let view='dashboard',filter={q:'',topic:'all',difficulty:'all',status:'all',role:'all',priority:'all'},reviewTab='due',edit=null;const opened=new Set();let toastTimer;
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=()=>dateKey(new Date());const addDays=(date,n)=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return dateKey(d)};const prettyDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—';const pct=(n,d)=>d?Math.round(100*n/d):0;const status=(id,k='problems')=>state[k][id]?.status||'Not started';const isSolved=id=>status(id)==='Solved';const isStudied=id=>status(id,'core')==='Studied';const getEntry=(id,k)=>state[k][id]||{status:'Not started',date:'',minutes:'',hints:'',confidence:'',notes:'',reviews:[]};const getItem=(id,k)=>k==='backend'?backendMap.get(id):k==='core'?coreMap.get(id):problemMap.get(id);const bar=(n,d,green=false)=>`<div class="bar ${green?'green':''}" role="progressbar" aria-label="Completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct(n,d)}"><span style="width:${pct(n,d)}%"></span></div>`;function notify(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false;notify('Browser storage unavailable. Export a backup to keep progress.')}updateNav()}
function reviewRows(){return [...problems.map(x=>({item:x,k:'problems'})),...cores.map(x=>({item:x,k:'core'})),...backends.map(x=>({item:x,k:'backend'}))].flatMap(({item,k})=>{const e=getEntry(item.id,k);if(!e.date||e.status==='Not started')return [];return [2,7,21].map(n=>({item,k,n,date:addDays(e.date,n),done:(e.reviews||[]).includes(n)}))}).sort((a,b)=>a.date.localeCompare(b.date))}function stats(){const reviews=reviewRows();return{solved:problems.filter(p=>isSolved(p.id)).length,mastered:patterns.filter(p=>state.patterns[p.id]).length,studied:cores.filter(c=>isStudied(c.id)).length,backend:backends.filter(c=>status(c.id,'backend')==='Studied').length,due:reviews.filter(r=>!r.done&&r.date<=today()).length,reviewed:reviews.filter(r=>r.done).length,reviewTotal:reviews.length}}
function updateNav(){const s=stats();$('#nav-dsa').textContent=`${s.solved}/${problems.length}`;$('#nav-core').textContent=`${s.studied}/${cores.length}`;$('#nav-backend').textContent=`${s.backend}/${backends.length}`;$('#nav-rev').textContent=s.due||'';if($('#nav-plan'))$('#nav-plan').textContent=planCompleted()+'/'+planIds().length;document.querySelector('.local').innerHTML=storageOK?'<span class="dot"></span><strong>Local workspace</strong><br>Progress stays in this browser.':'<strong>Storage unavailable</strong><br>Export backups to retain progress.'}
function heading(eyebrow,title,description,extra=''){return `<div class="intro"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>${extra}</div>`}function statCard(label,n,total,icon,foot,green=false){return `<div class="stat"><div class="stat-top">${label}<span class="stat-icon">${icon}</span></div><div class="stat-val">${n}<small> / ${total}</small></div>${bar(n,total,green)}<div class="stat-foot">${foot}</div></div>`}function topicDash(t,k){const count=k==='dsa'?t.patterns.flatMap(p=>p.problems):t.topics;const done=count.filter(x=>k==='dsa'?isSolved(x.id):isStudied(x.id)).length;return `<div class="dashrow"><button data-jump="${k}" data-topic="${t.id}">${esc(t.name)}</button>${bar(done,count.length,k==='core')}<span class="ratio">${done}/${count.length}</span></div>`}

function opt(value,label,selected){return `<option value="${esc(value)}" ${selected===value?'selected':''}>${esc(label)}</option>`}function statusSelect(id,k,selected){const options=k==='core'||k==='backend'?['Not started','Studied','Needs revision']:['Not started','Attempted','Solved','Needs revision'];return `<select aria-label="Update status" class="statusselect" data-status="${id}" data-kind="${k}">${options.map(x=>opt(x,x,selected)).join('')}</select>`}function filters(kind){const list=kind==='dsa'?DATA.dsa:kind==='backend'?DATA.backend:DATA.core;return `<div class="filterbar"><div class="searchbox"><input type="search" id="query" placeholder="${kind==='dsa'?'Search problems, patterns, topics…':kind==='backend'?'Search backend skills, tools, phases…':'Search concepts and subjects…'}" aria-label="Search" value="${esc(filter.q)}"></div><select data-filter="topic" aria-label="Select topic or subject">${opt('all',kind==='dsa'?'All topics':kind==='backend'?'All phases':'All subjects',filter.topic)}${list.map(t=>opt(t.id,t.name,filter.topic)).join('')}</select>${kind==='dsa'?`<select data-filter="difficulty" aria-label="Difficulty">${['all','Easy','Medium','Hard'].map(x=>opt(x,x==='all'?'All difficulties':x,filter.difficulty)).join('')}</select><select data-filter="role" aria-label="Problem type">${['all','Must-solve','Revision'].map(x=>opt(x,x==='all'?'All problem types':x,filter.role)).join('')}</select>`:`<select data-filter="priority" aria-label="Subject priority">${['all','P0','P1','P2'].map(x=>opt(x,x==='all'?'All priorities':x,filter.priority)).join('')}</select>`}<select data-filter="status" aria-label="Completion status">${['all','Not started',...(kind==='dsa'?['Attempted','Solved']:['Studied']),'Needs revision'].map(x=>opt(x,x==='all'?'All statuses':x,filter.status)).join('')}</select><button class="ghost" data-action="clear-filters">Reset</button></div><div class="filterbar" style="margin-top:0"><button class="ghost" data-action="expand">Expand all</button function problemRow(p){const e=getEntry(p.id,'problems');return `<div class="problemrow"><input type="checkbox" data-check="${p.id}" data-kind="problems" aria-label="Mark ${esc(p.name)} solved" ${e.status==='Solved'?'checked':''}><div class="pname"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" class="${e.status==='Solved'?'done-text':''}">${esc(p.name)} ↗</a>${e.confidence?`<div class="muted">Confidence ${e.confidence}/5${e.notes?' · note saved':''}</div>`:''}</div><span class="tag difficulty ${esc(p.difficulty)}">${esc(p.difficulty)}</span><span class="tag role">${p.role}</span>${statusSelect(p.id,'problems',e.status)}<button class="icon ghost problem-edit" style="padding:5px 8px" data-edit="${p.id}" data-kind="problems" aria-label="Edit ${esc(p.name)}" title="Log details">✎</button></div>`}
function dsaList(){const q=filter.q.trim().toLowerCase();let count=0;const active=Boolean(q)||filter.difficulty!=='all'||filter.role!=='all'||filter.status!=='all'||filter.topic!=='all';const html=DATA.dsa.filter(t=>filter.topic==='all'||filter.topic===t.id).map(t=>{const pp=t.patterns.map(p=>{const rows=p.problems.filter(x=>(!q||`${t.name} ${p.name} ${x.name}`.toLowerCase().includes(q))&&(filter.difficulty==='all'||x.difficulty===filter.difficulty)&&(filter.role==='all'||x.role===filter.role)&&(filter.status==='all'||status(x.id)===filter.status));count+=rows.length;if(!rows.length)return '';const done=p.problems.filter(x=>isSolved(x.id)).length;return `<details class="pattern" data-open-id="${p.id}" ${active||opened.has(p.id)?'open':''}><summary><input type="checkbox" data-pattern="${p.id}" aria-label="Mark ${esc(p.name)} mastered" ${state.patterns[p.id]?'checked':''}><span class="patternname ${state.patterns[p.id]?'done-text':''}">${esc(p.name)}</span><small>${done}/${p.problems.length} solved</small><span class="chevron">›</span></summary>${rows.map(problemRow).join('')}</details>`}).join('');if(!pp)return '';const all=t.patterns.flatMap(p=>p.problems);const done=all.filter(p=>isSolved(p.id)).length;const mastered=t.patterns.filter(p=>state.patterns[p.id]).length;return `<details class="topiccard" data-open-id="${t.id}" ${active||opened.has(t.id)?'open':''}><summary><span class="topicnum">${String(DATA.dsa.indexOf(t)+1).padStart(2,'0')}</span><div class="topicname"><h3>${esc(t.name)}</h3><small>${mastered}/${t.patterns.length} patterns mastered · ${all.length} problems</small></div><div class="topicprogress">${bar(done,all.length)}<span>${done}/${all.length}</span></div><span class="chevron">›</span></summary><div class="topicbody">${pp}</div></details>`}).join('');$('#list').innerHTML=html||'<div class="empty"><strong>No matching problems</strong>Try a different filter or search.</div>';$('#resultCount').textContent=`${count} of ${problems.length} problem entries`}
function coreList(){const q=filter.q.trim().toLowerCase();let count=0;const active=Boolean(q)||filter.topic!=='all'||filter.priority!=='all'||filter.status!=='all';const html=DATA.core.filter(t=>(filter.topic==='all'||t.id===filter.topic)&&(filter.priority==='all'||t.priority===filter.priority)).map(t=>{let section='';const rows=t.topics.filter(x=>(!q||`${t.name} ${x.section} ${x.name}`.toLowerCase().includes(q))&&(filter.status==='all'||status(x.id,'core')===filter.status));count+=rows.length;if(!rows.length)return '';const done=t.topics.filter(x=>isStudied(x.id)).length;return `<details class="topiccard" data-open-id="${t.id}" ${active||opened.has(t.id)?'open':''}><summary><span class="topicnum">${String(DATA.core.indexOf(t)+1).padStart(2,'0')}</span><div class="topicname"><h3>${esc(t.name)}</h3><small>${t.topics.length} topics · <span class="tag ${t.priority}">${t.priority}</span></small></div><div class="topicprogress">${bar(done,t.topics.length,true)}<span>${done}/${t.topics.length}</span></div><span class="chevron">›</span></summary><div class="topicbody">${rows.map(x=>{const label=x.section!==section?(section=x.section,section==='Topics'?'':`<div class="sectiontitle">${esc(section)}</div>`):'';const e=getEntry(x.id,'core');return `${label}<div class="corerow"><input type="checkbox" data-check="${x.id}" data-kind="core" aria-label="Mark ${esc(x.name)} studied" ${e.status==='Studied'?'checked':''}><div><span class="${e.status==='Studied'?'done-text':''}">${esc(x.name)}</span>${e.status==='Needs revision'?'<span class="tag due" style="margin-left:7px">Needs revision</span>':''}</div><span class="muted coreconfidence">${e.confidence?e.confidence+'/5 confidence':''}</span><button class="icon ghost" style="padding:5px 8px" data-edit="${x.id}" data-kind="core" aria-label="Edit ${esc(x.name)}" title="Log details">✎</button></div>`}).join('')}</div></details>`}).join('');$('#list').innerHTML=html||'<div class="empty"><strong>No matching topics</strong>Try a different function backendList(){const q=filter.q.trim().toLowerCase();let count=0;const active=Boolean(q)||filter.topic!=='all'||filter.priority!=='all'||filter.status!=='all';const html=DATA.backend.filter(t=>(filter.topic==='all'||t.id===filter.topic)&&(filter.priority==='all'||t.priority===filter.priority)).map(t=>{let section='';const rows=t.topics.filter(x=>(!q||`${t.name} ${x.section} ${x.name}`.toLowerCase().includes(q))&&(filter.status==='all'||status(x.id,'backend')===filter.status));count+=rows.length;if(!rows.length)return '';const done=t.topics.filter(x=>status(x.id,'backend')==='Studied').length;return `<details class="topiccard" data-open-id="${t.id}" ${active||opened.has(t.id)?'open':''}><summary><span class="topicnum">${String(DATA.backend.indexOf(t)+1).padStart(2,'0')}</span><div class="topicname"><h3>${esc(t.name)}</h3><small>${t.topics.length} skills · <span class="tag ${t.priority}">${t.priority}</span></small></div><div class="topicprogress">${bar(done,t.topics.length,true)}<span>${done}/${t.topics.length}</span></div><span class="chevron">›</span></summary><div class="topicbody"><div class="backend-resource"><a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">Learning resource ↗</a></div>${rows.map(x=>{const label=x.section!==section?(section=x.section,section==='Topics'?'':`<div class="sectiontitle">${esc(section)}</div>`):'';const e=getEntry(x.id,'backend');return `${label}<div class="corerow backendrow"><input type="checkbox" data-check="${x.id}" data-kind="backend" aria-label="Mark ${esc(x.name)} studied" ${e.status==='Studied'?'checked':''}><div><span class="${e.status==='Studied'?'done-text':''}">${esc(x.name)}</span>${e.status==='Needs revision'?'<span class="tag due" style="margin-left:7px">Needs revision</span>':''}</div>${statusSelect(x.id,'backend',e.status)}<button class="icon ghost" style="padding:5px 8px" data-edit="${x.id}" data-kind="backend" aria-label="Edit ${esc(x.name)}" title="Log details">✎</button></div>`}).join('')}</div></details>`}).join('');$('#list').innerHTML=html||'<div class="empty"><strong>No matching topics</strong>Try a different filter or search.</div>';$('#resultCount').textContent=`${count} of ${backends.length} backend skills`}
function listView(k){if(k==='backend'){backendView();return}app.innerHTML=(k==='dsa'?heading('Practice library','DSA practice',`${problems.length} problem entries · ${patterns.length} patterns · ${DATA.dsa.length} topic areas. Open a topic, solve problems and check off mastered patterns.`,`<button class="ghost" data-action="csv">Export CSV ↓</button>`):heading('Knowledge library','CS core subjects',`${cores.length} interview concepts across ${DATA.core.length} subjects. Check off topics as you study them and log your understanding.`,`<button class="ghost" data-action="csv">Export CSV ↓</button>`))+filters(k)+`<div class="info">${k==='dsa'?'Problem checkboxes mark solved. Pattern checkboxes track mastery independently. Use ✎ to log attempts, hints, notes and confidence.':'P0 = essential · P1 = high-value · P2 = role-dependent. Use ✎ for study notes and confidence.'}</div><div id="list" class="topiclist"></div>`;k==='dsa'?dsaList():coreList()}

function backendSummary(){if(!$('#backendRing'))return;const n=backends.filter(x=>status(x.id,'backend')==='Studied').length;const essential=backends.filter(x=>x.priority==='P0');$('#backendRing').style.setProperty('--pct',pct(n,backends.length));$('#backendPercent').textContent=pct(n,backends.length)+'%';$('#backendDone').textContent=`${n}/${backends.length}`;$('#backendEssential').textContent=`${essential.filter(x=>status(x.id,'backend')==='Studied').length}/${essential.length}`;}
const drills={2:'Recall the invariant or concept; reimplement / explain from memory.',7:'Solve a variant or answer an interview question without notes.',21:'Blind recall, test edge cases and explain trade-offs.'};function reviewRow(r){const late=r.date<today();return `<div class="reviewrow"><div><strong>${esc(r.item.name)}</strong><small>${esc(r.item.topic||r.item.subject)} · ${esc(drills[r.n])}</small></div><span class="tag ${r.done?'solved':late?'overdue':r.date===today()?'due':''}">${r.done?'Completed':late?'Overdue':r.date===today()?'Due today':'Upcoming'} · +${r.n}</span><span class="muted review-date">${prettyDate(r.date)}</span><button class="${r.done?'ghost':'primary'} review-action" data-review="${r.item.id}" data-kind="${r.k}" data-offset="${r.n}">${r.done?'Undo':'Mark done'}</button></div>`}
function revisions(){const rr=reviewRows(),due=rr.filter(r=>!r.done&&r.date<=today()),up=rr.filter(r=>!r.done&&r.date>today()),done=rr.filter(r=>r.done);const selected=reviewTab==='due'?due:reviewTab==='upcoming'?up:done;app.innerHTML=heading('Spaced repetition','Revision queue','Every logged first attempt or study date generates review checkpoints at +2, +7 and +21 days.')+`<div class="revisionsummary">${[['Due / overdue',due.length],['Upcoming',up.length],['Completed',done.length]].map(([name,n])=>`<div class="stat"><div class="stat-top">${name}</div><div class="stat-val">${n}</div></div>`).join('')}</div><section class="panel"><div class="tabs">${[['due','Due',due.length],['upcoming','Upcoming',up.length],['done','Completed',done.length]].map(([id,label,n])=>`<button data-revtab="${id}" class="${reviewTab===id?'active':''}">${label} · ${n}</button>`).join('')}</div>${selected.length?selected.map(reviewRow).join(''):'<div class="empty"><div class="empty-icon">↻</div><strong>No reviews in this view</strong>Start logging your study activity to build a revision queue.</div>'}</section><section class="panel sectiongap"><h2>How to revise</h2>${[2,7,21].map(n=>`<div class="dashrow" style="grid-template-columns:85px 1fr"><strong>Day +${n}</strong><span class="muted">${drills[n]}</span></div>`).join('')}</section>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#crumb').textContent={dashboard:'Overview',plan:'SDE roadmap',dsa:'DSA practice',core:'CS core',backend:'Python backend',revision:'Revisions'}[view];if(view==='dashboard')dashboard();else if(view==='plan')renderPlan();else if(view==='revision')revisions();else listView(view);updateNav()}
function resetFilters(){filter={q:'',topic:'all',difficulty:'all',status:'all',role:'all',priority:'all'}}function navigate(v,topic,pattern){view=v;resetFilters();opened.clear();if(topic){filter.topic=topic;opened.add(topic);if(pattern)opened.add(pattern)}render();window.scrollTo({top:0,behavior:'instant'})}function refreshList(){if(view==='dsa')dsaList();else if(view==='core')coreList();else if(view==='backend'){backendList();backendSummary()}else render()}

function openEditor(id,k){const item=getItem(id,k),e=getEntry(id,k);edit={id,k};$('#editLabel').textContent=k==='backend'?'Backend skill log':k==='core'?'CS topic log':'Problem practice log';$('#editTitle').textContent=item.name;$('#editSubtitle').textContent=k!=='problems'?item.subject:item.topic+' · '+item.pattern;$('#editBody').innerHTML=`<div class="fieldgrid"><label class="field">Status<select name="status">${(k!=='problems'?['Not started','Studied','Needs revision']:['Not started','Attempted','Solved','Needs revision']).map(x=>opt(x,x,e.status)).join('')}</select></label><label class="field">${k!=='problems'?'First study date':'First attempt date'}<input type="date" name="date" value="${esc(e.date)}"></label><label class="field">Time taken (minutes)<input type="number" min="0" max="99999" name="minutes" value="${esc(e.minutes)}" placeholder="e.g. 30"></label><label class="field">Confidence (1–5)<select name="confidence">${[['','Not rated'],['1','1 · Unfamiliar'],['2','2 · Recognize only'],['3','3 · With hints'],['4','4 · Independent'],['5','5 · Can teach / adapt']].map(([v,l])=>opt(v,l,String(e.confidence))).join('')}</select></label>${k==='problems'?`<label class="field">Highest hint level<select name="hints">${['','H0','H1','H2','H3','H4','H5','H6','Solution'].map(x=>opt(x,x||'Not logged',e.hints)).join('')}</select></label>`:''}</div><label class="field">Mistake / insight / study notes<textarea name="notes" maxlength="20000" placeholder="What did you learn? What will you do differently next time?">${esc(e.notes)}</textarea></label><div class="field">Completed revision checkpoints<div class="revisioncheck">${[2,7,21].map(n=>`<label><input type="checkbox" name="review" value="${n}" ${(e.reviews||[]).includes(n)?'checked':''}> +${n} days</label>`).join('')}</div><small>Revision dates are calculated from the first attempt or study date.</small></div>${k==='problems'?`<a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">Open practice problem ↗</a function download(name,contents,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([contents],{type}));a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}function csvCell(x){let s=String(x??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}function exportCsv(){const rows=[['Type','Topic','Pattern / Section','Problem / Concept','Link','Difficulty / Priority','Role','Status','First attempt / study date','Time taken (min)','Hints used','Mistake / insight','Confidence 1–5','Next revision date','Revised intervals']];for(const [items,k] of [[problems,'problems'],[cores,'core'],[backends,'backend']])for(const x of items){const e=getEntry(x.id,k),next=e.date&&e.status!=='Not started'?[2,7,21].find(n=>!(e.reviews||[]).includes(n)):null;rows.push([k==='backend'?'Python Backend':k==='core'?'CS Core':'DSA',x.topic||x.subject,x.pattern||x.section,x.name,x.url||'',x.difficulty||x.priority,x.role||'',e.status,e.date,e.minutes,e.hints,e.notes,e.confidence,next?addDays(e.date,next):'',(e.reviews||[]).join('; ')])}for(const t of DATA.dsa)for(const p of t.patterns)rows.push(['Pattern',t.name,p.name,'','','','',state.patterns[p.id]?'Mastered':'Not mastered']);for(const w of PLAN.weeks)for(const k of ['dsa','core','dev','drill'])rows.push(['SDE Roadmap','Week '+w.n,w.title,w[k],'','','',state.plan['plan-w'+w.n+'-'+k]?'Completed':'Not completed']);for(const m of PLAN.milestones){m.features.forEach((x,i)=>rows.push(['Project',m.project,'Feature',x,'','','',state.plan['plan-'+m.id+'-f'+i]?'Completed':'Not completed']));m.gate.forEach((x,i)=>rows.push(['Project',m.project,'Exit gate',x,'','','',state.plan['plan-'+m.id+'-g'+i]?'Completed':'Not completed']))}for(const a of state.applications)rows.push(['Application',a.company,a.role,'',a.url,'','',a.status,a.date,'','',a.notes]);download('prepfolio-progress.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');notify('Progress CSV exported')}
function theme(){document.documentElement.classList.toggle('light',state.theme==='light');const b=document.querySelector('[data-action="theme"]');b.textContent=state.theme==='light'?'☾':'☀'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){navigate(b.dataset.view);return}if(b.dataset.jump){navigate(b.dataset.jump,b.dataset.topic,b.dataset.pattern);return}if(b.dataset.edit){openEditor(b.dataset.edit,b.dataset.kind);return}if(b.dataset.revtab){reviewTab=b.dataset.revtab;revisions();return}if(b.dataset.review){const k=b.dataset.kind,id=b.dataset.review,n=Number(b.dataset.offset),entry=getEntry(id,k);const rr=new Set(entry.reviews||[]);rr.has(n)?rr.delete(n):rr.add(n);state[k][id]={...entry,reviews:[...rr]};save();render();notify(rr.has(n)?'Revision completed':'Revision reopened');return}switch(b.dataset.action){case 'theme':state.theme=state.theme==='light'?'dark':'light';theme();save();break;case 'export':download('prepfolio-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');notify('Backup exported');break;case 'import':$('#importFile').click();break;case 'csv':exportCsv();break;case 'clear-filters':resetFilters();opened.clear();listView(view);break;case 'expand':document.querySelectorAll('#list details').forEach(x=>{x.open=true;opened.add(x.dataset.openId)});break;case 'collapse':document.querySelectorAll('#list details').forEach(x=>{x.open=false;opened.delete(x.dataset.openId)});break;case 'close':$('#editor').close();break;case 'clear-item':if(edit&&confirm('Clear all saved progress for this entry?')){delete state[edit.k][edit.id];save();$('#editor').close();refreshList();notify('Entry cleared')}break}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.filter){filter[el.dataset.filter]=el.value;refreshList();return}if(el.dataset.check){setStatus(el.dataset.check,el.dataset.kind,el.checked?(el.dataset.kind!=='problems'?'Studied':'Solved'):'Not started');return}if(el.dataset.pattern){state.patterns[el.dataset.pattern]=el.checked;save();refreshList();return}if(el.dataset.status){setStatus(el.dataset.status,el.dataset.kind,el.value)}});document.addEventListener('input',e=>{if(e.target.id==='query'){filter.q=e.target.value;refreshList()}});document.addEventListener('toggle',e=>{const id=e.target.dataset?.openId;if(id&&e.target.isConnected){e.target.open?opened.add(id):opened.delete(id)}},true);document.addEventListener('click',e=>{if(e.target.matches('summary input[type=checkbox]'))e.stopPropagation()},true);

let planTab='timeline';const planOpen=new Set();
const planIds=()=>[...PLAN.weeks.flatMap(w=>['dsa','core','dev','drill'].map(k=>`plan-w${w.n}-${k}`)),...PLAN.milestones.flatMap(m=>[...m.features.map((_,i)=>`plan-${m.id}-f${i}`),...m.gate.map((_,i)=>`plan-${m.id}-g${i}`)])];
const planCompleted=()=>planIds().filter(id=>state.plan[id]).length;
const planCheck=(id,txt,sub='')=>`<label class="planrow"><input type="checkbox" data-plancheck="${id}" ${state.plan[id]?'checked':''}><span class="${state.plan[id]?'plancheckdone':''}">${esc(txt)}${sub?`<small>${esc(sub)}</small>`:''}</span></label>`;
const planRefs=keys=>`<div class="planlinks">${keys.split(' ').filter(k=>PLAN.resources[k]).map(k=>`<a href="${esc(PLAN.resources[k][1])}" target="_blank" rel="noopener noreferrer">${esc(PLAN.resources[k][0])} ↗</a>`).join('')}</div>`;
function planJumps(ids){return `<div class="planlinks">${ids.map(id=>{const kind=id[0]==='d'?'dsa':id[0]==='c'?'core':'backend';const t=DATA[kind].find(x=>x.id===id);return t?`<button data-jump="${kind}" data-topic="${id}">${esc(t.name)} →</button>`:''}).join('')}</div>`}
function planWeek(w){const ids=['dsa','core','dev','drill'].map(k=>`plan-w${w.n}-${k}`),n=ids.filter(id=>state.plan[id]).length;return `<details class="planweek" data-planopen="w${w.n}" ${planOpen.has('w'+w.n)?'open':''}><summary><strong>Week ${w.n} · ${esc(w.title)}</strong><span class="tag">${w.target} new DSA</span><span class="tag ${n===4?'solved':''}">${n}/4</span></summary>${planCheck(ids[0],w.dsa,`DSA target: ${w.target} unique new problems; revisit old ones separately.`)}${planCheck(ids[1],w.core,'Recall without notes; answer 3–5 interview questions.')}${planCheck(ids[2],w.dev,'Ship a small vertical slice; commit and test.')}${planCheck(ids[3],w.drill,'Implement independently, then compare or ask for review.')}${w.extra?`<p>${esc(w.extra)}</p>`:''}<h4>Study & code resources</h4>${planRefs(w.res.join(' '))}<h4>Open your existing checklists</h4>${planJumps(w.links)}</details>`}
function planMilestone(m){const ids=[...m.features.map((_,i)=>`plan-${m.id}-f${i}`),...m.gate.map((_,i)=>`plan-${m.id}-g${i}`)],n=ids.filter(id=>state.plan[id]).length;return `<section class="panel plansection"><div class="panelhead"><div><div class="eyebrow">${m.id.toUpperCase()} · ${esc(m.when)}</div><h2>${esc(m.title)}</h2></div><div class="planprogress">${bar(n,ids.length,true)}<small>${n}/${ids.length} release checks</small></div></div><div class="planproject"><div class="eyebrow">Portfolio release</div><h3>${esc(m.project)}</h3><p class="planmuted">${esc(m.stack)}</p><p>${esc(m.scope)}</p><div class="architecture">${esc(m.architecture)}</div><h4>Build checklist</h4>${m.features.map((x,i)=>planCheck(`plan-${m.id}-f${i}`,x)).join('')}<h4>Exit gate · evidence required</h4>${m.gate.map((x,i)=>planCheck(`plan-${m.id}-g${i}`,x)).join('')}<p class="resume"><strong>Resume direction (not a completed claim):</strong> ${esc(m.resume)}</p>${planRefs(m.refs)}</div>${PLAN.weeks.filter(w=>w.n>=m.weeks[0]&&w.n<=m.weeks[1]).map(planWeek).join('')}</section>`}
function planRoutine(){return `<section class="panel plansection"><h2>Time budget & prioritization</h2><p class="muted">Start on your chosen Day 1. First 40 days: 80–120 hours at 2–3 hours/day. After classes: planning assumption of ~6–9 hours/week (adjust pace during exams). Weeks 7–24 are a rolling sequence, not a deadline; extend if your available hours fall.</p><div class="dashgrid sectiongap"><div class="planproject"><h3>40-day intensive · 150 min example</h3><p>65 min DSA (one new medium or two easier + review) · 65 min backend/project · 20 min CS recall/SQL. At 120 min: 50/55/15. At 180 min: 80/75/25. One lighter review day per week. Finish existing assignment first if deadlines overlap.</p></div><div class="planproject"><h3>After classes · sustainable week</h3><p>4 weekdays × 45–60 min: alternate DSA + CS and project; weekend 2 × 90–150 min: project release, mock and revision. During exams: 20 min recall or rest, resume from last incomplete week. Apply early; don't wait for all milestones.</p></div></div><h3 style="margin-top:16px">First 40 days · practical schedule</h3>${PLAN.days.map(([day,txt])=>`<div class="planrow"><strong style="width:83px;flex:none">Day ${esc(day)}</strong><span>${esc(txt)}</span></div>`).join('')}<h3 style="margin-top:16px">Mastery rules</h3><p class="muted">Attempt unseen problem 20–35 min; request a hint, not solution; reimplement closed-book; record complexity and error. Revise +2/+7/+21 days via the existing revision tab. Count distinct problem URLs, not repeated pattern entries. At least 70% of practice should be independently solvable at the end; use actual timed results, not checkbox totals. Learn concept → implement small exercise → test → explain → integrate.</p></section>`}
function planInterview(){return `<section class="panel plansection"><h2>Off-campus hiring playbook</h2><p class="muted">Primary: SDE I / Graduate SWE / backend-focused full-stack / internship-to-PPO. Secondary: cloud/platform junior roles where skills fit. Retain campus placement and aptitude preparation as insurance. Apply to product companies, funded startups and strong engineering teams; eligibility and pay vary. Target ₹25 LPA total compensation, not guaranteed base salary or offer. Compare fixed pay, variable, annual equity vesting, joining bonus, location, bond and learning.</p><div class="planproject"><h3>Application cadence</h3><p>Weeks 1–6: build baseline CV, LinkedIn, GitHub, campus eligibility; watch openings and apply to eligible time-sensitive roles. Weeks 7–14: aim 5–8 tailored applications/week, 2–3 relevant alumni/referral conversations, one mock every 1–2 weeks. Weeks 15–24: aim 8–12 applications/week, 1–2 mocks/week if schedule allows. Review funnel every two weeks; improve CV if no screens, coding if OAs fail, explanation/design if interviews fail.</p><p>Prepare 6–8 STAR stories: ownership, difficult bug, failure/learning, conflict, teamwork, deadline, ambiguity and impact. Use real project/class examples. Campus aptitude: quantitative, reasoning, verbal and timed practice.</p>${planRefs('amz ms apt jobs wellfound amazonjobs msjobs googlejobs')}</div><div class="planproject"><h3>Readiness gates (targets, not hiring promises)</h3><p>180–200 unique high-quality DSA problems by week 24 (weekly target sum ${PLAN.weeks.reduce((a,w)=>a+w.target,0)}); 40–60 SQL drills; 12+ timed OAs; 8–12 coding mocks; 5–8 design/LLD mocks. Finish 2–3 independent or substantially extended repos. Repeatedly solve unseen medium within ~30–40 min with clean code, tests and complexity. Explain DB isolation, OS concurrency, HTTP/TLS, OOP and project trade-offs without notes.</p><p>Priorities: P0 DSA + backend fundamentals + CS core + resume/applications; P1 React/TS, Redis/queues, deployment, LLD/HLD; P2 optional Django, Kafka, Kubernetes, Terraform and deeper ML only when useful. COA/TOC/compiler basics for campus-specific rounds. Avoid parallel stacks, credential collecting and tutorial copying.</p></div><h3 style="margin-top:16px">Application tracker</h3><form id="planAppForm" class="planlog sectiongap"><input name="company" placeholder="Company" required maxlength="200"><input name="role" placeholder="Role / requisition" required maxlength="200"><input name="url" type="url" placeholder="Posting URL (optional)"><select name="status">${['Wishlist','Applied','Referral requested','OA','Interview','Offer','Rejected','Closed'].map(x=>`<option>${x}</option>`).join('')}</select><input type="date" name="date" value="${today()}"><button type="submit" class="primary">Add application</button><textarea name="notes" maxlength="4000" placeholder="Referral, compensation breakdown, next step, deadline or feedback"></textarea></form><div class="planloglist">${state.applications.length?state.applications.map((x,i)=>`<div class="planrow"><span><strong>${esc(x.company)} · ${esc(x.role)}</strong><small>${esc(x.date)} · ${esc(x.notes)}</small>${/^https?:\/\//i.test(x.url)?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Posting ↗</a>`:''}</span><select aria-label="Application status" data-appstatus="${i}">${['Wishlist','Applied','Referral requested','OA','Interview','Offer','Rejected','Closed'].map(v=>opt(v,v,x.status)).join('')}</select><button data-appdelete="${i}" aria-label="Remove application">Remove</button></div>`).join(''):'<p class="muted">No applications yet. Add a role when you find one.</p>'}</div></section>`}
function planResources(){const groups=[['DSA & coding','cpp learncpp lc neetcode cses cf sql sqlbolt'],['Python, APIs, database & tests','python async typing git linux ruff uv http fastapi pydantic postgres pgindex sa alembic pytest security cheats'],['Frontend & cloud','js css react ts docker gha aws awsarch cost'],['Production & design','redis celery k6 otel prom django drf os db cn lld hld sre kafka tf k8s'],['ML & hiring','ml mlflow amz ms github jobs wellfound amazonjobs msjobs googlejobs apt']];return `<section class="panel plansection"><h2>Curated resource library</h2><p class="muted">Start with one resource per topic; read the relevant section, code a small example, and return to the milestone. Official docs and free practice are preferred; some platforms offer paid features. Links require internet; availability and paths may change.</p>${groups.map(([name,keys])=>`<h3 style="margin:16px 0 7px">${esc(name)}</h3><div class="planresource">${keys.split(' ').map(k=>`<a href="${esc(PLAN.resources[k][1])}" target="_blank" rel="noopener noreferrer">${esc(PLAN.resources[k][0])} ↗</a>`).join('')}</div>`).join('')}</section>`}
function planTutor(){return `<section class="panel plansection"><h2>Learn with ChatGPT instead of a tutorial</h2><p class="muted">Copy a prompt into your ChatGPT conversation and replace placeholders. This standalone HTML does not connect to an AI service, execute your code or automatically sync quiz results; manually log progress here. Use official docs to verify API details and run your own tests.</p>${PLAN.tutor.map(([name,prompt],i)=>`<div class="planproject"><h3>${esc(name)}</h3><textarea readonly class="plantext" id="tutor-${i}">${esc(prompt)}</textarea><button data-tutorcopy="${i}">Copy prompt</button></div>`).join('')}</section>`}
function renderPlan(){const n=planCompleted(),total=planIds().length;const count=PLAN.weeks.reduce((a,w)=>a+w.target,0);app.innerHTML=heading('Personalized · off-campus preparation','Your SDE roadmap','Backend-focused software engineering with cloud and applied AI depth. C++ for DSA, Python for backend, React/TypeScript for practical full-stack delivery.')+`<section class="planhero"><div><div class="eyebrow">Target · ₹25 LPA+ CTC</div><h2>Build proof, not just a skill list.</h2><p>Third-year CSE · 40-day intensive, then a flexible 24-week path. Use existing C++/Python/Flask, AWS, SQL, networks and ML experience; focus on independence, correctness, deployment and interview performance. Keep campus backup. Compensation is a target, not a promise.</p><div class="hero-actions"><button class="primary" data-plantab="timeline">Milestones →</button><button data-plantab="routine">40-day plan</button><button data-plantab="interview">Hiring tracker</button></div></div><div class="planmetrics"><div class="planmetric"><strong>24</strong><small>weeks · flexible</small></div><div class="planmetric"><strong>${count}</strong><small>unique DSA target</small></div><div class="planmetric"><strong>3</strong><small>flagship projects · 6 releases</small></div><div class="planmetric"><strong>${pct(n,total)}%</strong>${bar(n,total,true)}<small>${n}/${total} roadmap checks</small></div></div></section><div class="plansticky" role="navigation" aria-label="Roadmap sections">${[['timeline','Milestones & weeks'],['routine','40 days & routine'],['resources','Resource library'],['tutor','Learn with ChatGPT'],['interview','Hiring & applications']].map(([id,name])=>`<button class="${planTab===id?'active':''}" data-plantab="${id}">${name}</button>`).join('')}</div>`+(planTab==='timeline'?`<p class="planmuted">Check weekly outcomes only after demonstrating them. Use the linked original catalog for individual topics and problem status. Project releases deliberately build on each other; no need to create six separate repositories.</p>${PLAN.milestones.map(planMilestone).join('')}`:planTab==='routine'?planRoutine():planTab==='resources'?planResources():planTab==='tutor'?planTutor():planInterview());}
document.addEventListener('toggle',e=>{const k=e.target.dataset?.planopen;if(k&&e.target.isConnected){e.target.open?planOpen.add(k):planOpen.delete(k)}},true);
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.plancheck){state.plan[el.dataset.plancheck]=el.checked;save();renderPlan();return}if(el.dataset.appstatus!==undefined){const x=state.applications[Number(el.dataset.appstatus)];if(x){x.status=el.value;save();renderPlan()}}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.plantab){planTab=b.dataset.plantab;renderPlan();return}if(b.dataset.appdelete!==undefined){if(confirm('Remove this application?')){state.applications.splice(Number(b.dataset.appdelete),1);save();renderPlan()}return}if(b.dataset.tutorcopy!==undefined){const t=$('#tutor-'+b.dataset.tutorcopy);try{await navigator.clipboard.writeText(t.value);notify('Prompt copied')}catch(err){t.focus();t.select();try{if(document.execCommand('copy'))notify('Prompt copied');else notify('Prompt selected — press Ctrl+C / Cmd+C')}catch(e){notify('Prompt selected — press Ctrl+C / Cmd+C')}}}});
document.addEventListener('submit',e=>{if(e.target.id==='planAppForm'){e.preventDefault();const v=Object.fromEntries(new FormData(e.target));state.applications.push(v);save();renderPlan();notify('Application added')}});

$('#todayLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});theme();render();
