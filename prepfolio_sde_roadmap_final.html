function listView(k){if(k==='backend'){backendView();return}app.innerHTML=(k==='dsa'?heading('Practice library','DSA practice',`${problems.length} problem entries · ${patterns.length} patterns · ${DATA.dsa.length} topic areas. Open a topic, solve problems and check off mastered patterns.`,`<button class="ghost" data-action="csv">Export CSV ↓</button>`):heading('Knowledge library','CS core subjects',`${cores.length} interview concepts across ${DATA.core.length} subjects. Check off topics as you study them and log your understanding.`,`<button class="ghost" data-action="csv">Export CSV ↓</button>`))+filters(k)+`<div class="info">${k==='dsa'?'Only questions from your supplied screenshots. Basic/Core/Pro are source labels, not difficulty ratings. Unlabeled means no label was visible in the screenshot. ★ toggles bookmarks; ✎ logs details. Links open a search for the question. Imported solved entries have no attempt date until you log one.':'P0 = essential · P1 = high-value · P2 = role-dependent. Use ✎ for study notes and confidence.'}</div><div id="list" class="topiclist"></div>`;k==='dsa'?dsaList():coreList()}
function backendView(){const n=backends.filter(x=>status(x.id,'backend')==='Studied').length;const essential=backends.filter(x=>x.priority==='P0');const next=backends.find(x=>x.priority==='P0'&&status(x.id,'backend')!=='Studied')||backends.find(x=>status(x.id,'backend')!=='Studied');app.innerHTML=heading('Development workspace','Python backend roadmap',`${backends.length} trackable skills and project milestones across ${DATA.backend.length} phases. Use this as the detailed reference catalog; follow the SDE roadmap for weekly sequencing and scope.`,`<button class="ghost" data-action="csv">Export CSV ↓</button>`)+`<section class="hero backendhero"><div><div class="eyebrow">Your chosen stack</div><h2>Build. Ship. Scale.</h2><p>Python → FastAPI → PostgreSQL → secure APIs → testing → Redis → Docker + AWS → system design.</p><div class="hero-actions">${next?`<button class="primary" data-jump="backend" data-topic="${next.subjectId}">Continue roadmap →</button>`:''}<button class="ghost" data-view="revision">Review queue</button></div></div><div class="hero-right"><div class="ring" id="backendRing" style="--pct:${pct(n,backends.length)}"><div class="ring-inner"><strong id="backendPercent">${pct(n,backends.length)}%</strong><small>roadmap done</small></div></div><div class="legend"><div><strong id="backendDone">${n}/${backends.length}</strong>Skills completed</div><div><strong id="backendEssential">${essential.filter(x=>status(x.id,'backend')==='Studied').length}/${essential.length}</strong>Essential milestones</div></div></div></section>`+filters('backend')+`<div class="info">P0 = essential · P1 = next-level · P2 = optional specialization. Use the SDE roadmap for scheduling; catalog phases are reference groups, not deadlines. Check a skill after practice, or use ✎ for confidence, notes, and +2/+7/+21-day reviews.</div><div id="list" class="topiclist"></div>`;backendList()}
function backendSummary(){if(!$('#backendRing'))return;const n=backends.filter(x=>status(x.id,'backend')==='Studied').length;const essential=backends.filter(x=>x.priority==='P0');$('#backendRing').style.setProperty('--pct',pct(n,backends.length));$('#backendPercent').textContent=pct(n,backends.length)+'%';$('#backendDone').textContent=`${n}/${backends.length}`;$('#backendEssential').textContent=`${essential.filter(x=>status(x.id,'backend')==='Studied').length}/${essential.length}`;}
const drills={2:'Recall the invariant or concept; reimplement / explain from memory.',7:'Solve a variant or answer an interview question without notes.',21:'Blind recall, test edge cases and explain trade-offs.'};function reviewRow(r){const late=r.date<today();return `<div class="reviewrow"><div><strong>${esc(r.item.name)}</strong><small>${esc(r.item.topic||r.item.subject)} · ${esc(drills[r.n])}</small></div><span class="tag ${r.done?'solved':late?'overdue':r.date===today()?'due':''}">${r.done?'Completed':late?'Overdue':r.date===today()?'Due today':'Upcoming'} · +${r.n}</span><span class="muted review-date">${prettyDate(r.date)}</span><button class="${r.done?'ghost':'primary'} review-action" data-review="${r.item.id}" data-kind="${r.k}" data-offset="${r.n}">${r.done?'Undo':'Mark done'}</button></div>`}
function revisions(){const rr=reviewRows(),due=rr.filter(r=>!r.done&&r.date<=today()),up=rr.filter(r=>!r.done&&r.date>today()),done=rr.filter(r=>r.done);const selected=reviewTab==='due'?due:reviewTab==='upcoming'?up:done;app.innerHTML=heading('Spaced repetition','Revision queue','Every logged first attempt or study date generates review checkpoints at +2, +7 and +21 days.')+`<div class="revisionsummary">${[['Due / overdue',due.length],['Upcoming',up.length],['Completed',done.length]].map(([name,n])=>`<div class="stat"><div class="stat-top">${name}</div><div class="stat-val">${n}</div></div>`).join('')}</div><section class="panel"><div class="tabs">${[['due','Due',due.length],['upcoming','Upcoming',up.length],['done','Completed',done.length]].map(([id,label,n])=>`<button data-revtab="${id}" class="${reviewTab===id?'active':''}">${label} · ${n}</button>`).join('')}</div>${selected.length?selected.map(reviewRow).join(''):'<div class="empty"><div class="empty-icon">↻</div><strong>No reviews in this view</strong>Start logging your study activity to build a revision queue.</div>'}</section><section class="panel sectiongap"><h2>How to revise</h2>${[2,7,21].map(n=>`<div class="dashrow" style="grid-template-columns:85px 1fr"><strong>Day +${n}</strong><span class="muted">${drills[n]}</span></div>`).join('')}</section>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#crumb').textContent={dashboard:'Overview',plan:'SDE roadmap',dsa:'DSA practice',core:'CS core',backend:'Python backend',revision:'Revisions'}[view];if(view==='dashboard')dashboard();else if(view==='plan')renderPlan();else if(view==='revision')revisions();else listView(view);updateNav()}
function resetFilters(){filter={q:'',topic:'all',difficulty:'all',status:'all',role:'all',priority:'all'}}function navigate(v,topic,pattern){view=v;resetFilters();opened.clear();if(topic){filter.topic=topic;opened.add(topic);if(pattern)opened.add(pattern)}render();window.scrollTo({top:0,behavior:'instant'})}function refreshList(){if(view==='dsa')dsaList();else if(view==='core')coreList();else if(view==='backend'){backendList();backendSummary()}else render()}
function setStatus(id,k,newStatus){const e=getEntry(id,k);state[k][id]={...e,status:newStatus,date:newStatus==='Not started'?e.date:e.date||today(),reviews:e.reviews||[]};save();refreshList()}
function openEditor(id,k){const item=getItem(id,k),e=getEntry(id,k);edit={id,k};$('#editLabel').textContent=k==='backend'?'Backend skill log':k==='core'?'CS topic log':'Problem practice log';$('#editTitle').textContent=item.name;$('#editSubtitle').textContent=k!=='problems'?item.subject:item.topic+' · '+item.pattern;$('#editBody').innerHTML=`<div class="fieldgrid"><label class="field">Status<select name="status">${(k!=='problems'?['Not started','Studied','Needs revision']:['Not started','Attempted','Solved','Needs revision']).map(x=>opt(x,x,e.status)).join('')}</select></label><label class="field">${k!=='problems'?'First study date':'First attempt date'}<input type="date" name="date" value="${esc(e.date)}"></label><label class="field">Time taken (minutes)<input type="number" min="0" max="99999" name="minutes" value="${esc(e.minutes)}" placeholder="e.g. 30"></label><label class="field">Confidence (1–5)<select name="confidence">${[['','Not rated'],['1','1 · Unfamiliar'],['2','2 · Recognize only'],['3','3 · With hints'],['4','4 · Independent'],['5','5 · Can teach / adapt']].map(([v,l])=>opt(v,l,String(e.confidence))).join('')}</select></label>${k==='problems'?`<label class="field">Highest hint level<select name="hints">${['','H0','H1','H2','H3','H4','H5','H6','Solution'].map(x=>opt(x,x||'Not logged',e.hints)).join('')}</select></label>`:''}</div><label class="field">Mistake / insight / study notes<textarea name="notes" maxlength="20000" placeholder="What did you learn? What will you do differently next time?">${esc(e.notes)}</textarea></label><div class="field">Completed revision checkpoints<div class="revisioncheck">${[2,7,21].map(n=>`<label><input type="checkbox" name="review" value="${n}" ${(e.reviews||[]).includes(n)?'checked':''}> +${n} days</label>`).join('')}</div><small>Revision dates are calculated from the first attempt or study date.</small></div>${k==='problems'?`<a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">Search for practice problem ↗</a>`:''}`;$('#editor').showModal()}
function download(name,contents,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([contents],{type}));a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}function csvCell(x){let s=String(x??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}function exportCsv(){const rows=[['Type','Topic','Pattern / Section','Problem / Concept','Link','TUF label / Priority','Bookmark','Status','First attempt / study date','Time taken (min)','Hints used','Mistake / insight','Confidence 1–5','Next revision date','Revised intervals']];for(const [items,k] of [[problems,'problems'],[cores,'core'],[backends,'backend']])for(const x of items){const e=getEntry(x.id,k),next=e.date&&e.status!=='Not started'?[2,7,21].find(n=>!(e.reviews||[]).includes(n)):null;rows.push([k==='backend'?'Python Backend':k==='core'?'CS Core':'DSA',x.topic||x.subject,x.pattern||x.section,x.name,x.url||'',x.difficulty||x.priority,k==='problems'?(state.bookmarks[x.id]?'Bookmarked':'Not bookmarked'):'',e.status,e.date,e.minutes,e.hints,e.notes,e.confidence,next?addDays(e.date,next):'',(e.reviews||[]).join('; ')])}for(const t of DATA.dsa)for(const p of t.patterns)rows.push(['Pattern',t.name,p.name,'','','','',state.patterns[p.id]?'Mastered':'Not mastered']);for(const w of PLAN.weeks)for(const k of ['dsa','core','dev','drill'])rows.push(['SDE Roadmap','Week '+w.n,w.title,w[k],'','','',state.plan['plan-w'+w.n+'-'+k]?'Completed':'Not completed']);for(const m of PLAN.milestones){m.features.forEach((x,i)=>rows.push(['Project',m.project,'Feature',x,'','','',state.plan['plan-'+m.id+'-f'+i]?'Completed':'Not completed']));m.gate.forEach((x,i)=>rows.push(['Project',m.project,'Exit gate',x,'','','',state.plan['plan-'+m.id+'-g'+i]?'Completed':'Not completed']))}for(const a of state.applications)rows.push(['Application',a.company,a.role,'',a.url,'','',a.status,a.date,'','',a.notes]);download('prepfolio-progress.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');notify('Progress CSV exported')}
function theme(){document.documentElement.classList.toggle('light',state.theme==='light');const b=document.querySelector('[data-action="theme"]');b.textContent=state.theme==='light'?'☾':'☀'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){navigate(b.dataset.view);return}if(b.dataset.jump){navigate(b.dataset.jump,b.dataset.topic,b.dataset.pattern);return}if(b.dataset.bookmark){const id=b.dataset.bookmark;state.bookmarks[id]=!state.bookmarks[id];save();refreshList();return}if(b.dataset.edit){openEditor(b.dataset.edit,b.dataset.kind);return}if(b.dataset.revtab){reviewTab=b.dataset.revtab;revisions();return}if(b.dataset.review){const k=b.dataset.kind,id=b.dataset.review,n=Number(b.dataset.offset),entry=getEntry(id,k);const rr=new Set(entry.reviews||[]);rr.has(n)?rr.delete(n):rr.add(n);state[k][id]={...entry,reviews:[...rr]};save();render();notify(rr.has(n)?'Revision completed':'Revision reopened');return}switch(b.dataset.action){case 'theme':state.theme=state.theme==='light'?'dark':'light';theme();save();break;case 'export':download('prepfolio-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');notify('Backup exported');break;case 'import':$('#importFile').click();break;case 'csv':exportCsv();break;case 'clear-filters':resetFilters();opened.clear();listView(view);break;case 'expand':document.querySelectorAll('#list details').forEach(x=>{x.open=true;opened.add(x.dataset.openId)});break;case 'collapse':document.querySelectorAll('#list details').forEach(x=>{x.open=false;opened.delete(x.dataset.openId)});break;case 'close':$('#editor').close();break;case 'clear-item':if(edit&&confirm('Clear all saved progress for this entry?')){if(edit.k==='problems')state.problems[edit.id]={status:'Not started',date:'',minutes:'',hints:'',confidence:'',notes:'',reviews:[]};else delete state[edit.k][edit.id];save();$('#editor').close();refreshList();notify('Entry cleared')}break}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.filter){filter[el.dataset.filter]=el.value;refreshList();return}if(el.dataset.check){setStatus(el.dataset.check,el.dataset.kind,el.checked?(el.dataset.kind!=='problems'?'Studied':'Solved'):'Not started');return}if(el.dataset.pattern){state.patterns[el.dataset.pattern]=el.checked;save();refreshList();return}if(el.dataset.status){setStatus(el.dataset.status,el.dataset.kind,el.value)}});document.addEventListener('input',e=>{if(e.target.id==='query'){filter.q=e.target.value;refreshList()}});document.addEventListener('toggle',e=>{const id=e.target.dataset?.openId;if(id&&e.target.isConnected){e.target.open?opened.add(id):opened.delete(id)}},true);document.addEventListener('click',e=>{if(e.target.matches('summary input[type=checkbox]'))e.stopPropagation()},true);
$('#editForm').addEventListener('submit',e=>{e.preventDefault();if(!edit)return;const fd=new FormData(e.target),entry=Object.fromEntries(fd);entry.reviews=fd.getAll('review').map(Number);delete entry.review;if(entry.status!=='Not started'&&!entry.date)entry.date=today();state[edit.k][edit.id]=entry;save();$('#editor').close();refreshList();notify('Progress saved')});$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const loaded=normalize(JSON.parse(await file.text()));if(confirm('Replace your current progress with this backup?')){state=loaded;save();theme();render();notify('Backup imported')}}catch(err){notify('Import failed: invalid Prepfolio backup')}e.target.value=''});

const PLAN={"weeks":[{"n":1,"title":"Baseline & engineering habits","dsa":"Arrays, hashing, strings, two pointers; prefix sums; STL containers","core":"OOP, complexity, Linux process/permissions; SQL SELECT/JOIN refresh","dev":"Audit Python fundamentals; type hints, exceptions, modules, venv/uv, Git branching; initialize SignalDesk repo with model/data contract and tests. Reuse your tweet classifier only after understanding its training/inference.","drill":"Implement frequency map in C++; Python typed prediction function; pytest parametrized cases; git branch + PR.","res":["cpp","python","git","uv","pytest","lc"],"links":["d0","d1","d2","d3","b0","b1","c4"],"target":10,"extra":"Skip familiar syntax after passing a closed-book exercise. Finish existing tweet filtering assignment first if it overlaps."},{"n":2,"title":"HTTP & API foundations","dsa":"Sliding windows, sorting, binary search; boundaries and monotonic predicates","core":"DNS, TCP, TLS, HTTP methods/status, REST and idempotency","dev":"FastAPI + Pydantic; create prediction, batch input and health endpoints, schemas, exceptions, OpenAPI; configure environment and log request IDs.","drill":"Use curl to test valid, empty and invalid payloads; write binary search on answer from scratch.","res":["http","fastapi","pydantic","neetcode","cpp"],"links":["d4","d5","d6","b2","b3","c3","c9"],"target":10,"extra":""},{"n":3,"title":"Relational persistence","dsa":"Linked lists, stacks, queues; reversal, monotonic stack, deque","core":"DBMS keys, normalization, ACID, joins, transactions","dev":"PostgreSQL, SQLAlchemy session lifecycle, Alembic; store jobs/results with constraints and timestamps; implement filtering and pagination.","drill":"Write JOIN, GROUP BY, CTE; migration up/down on disposable database; integration test against PostgreSQL.","res":["postgres","sqlbolt","sa","alembic","sql"],"links":["d7","d8","d9","b4","b5","c0","c1"],"target":10,"extra":""},{"n":4,"title":"Secure service & testing","dsa":"Trees, BST, ch/typed API clients; UI error/empty/loading flows.","drill":"Implement backtracking templates; build typed form with error handling.","res":["react","ts","css","lld"],"links":["d12","d15","c4","c6"],"target":8,"extra":""},{"n":8,"title":"Concurrency & caching","dsa":"Greedy, intervals, heap scheduling","core":"OS concurrency, deadlock, locks; DB isolation","dev":"Async I/O vs CPU-bound inference; bounded concurrency, timeouts; Redis TTL/cache-aside, invalidation, rate limits.","drill":"Measure sync vs async I/O locally; ensure cache keys include relevant tenant/model version.","res":["async","redis","os"],"links":["d16","d11","d10","b1","b8","c2"],"target":8,"extra":""},{"n":9,"title":"Reliable background processing","dsa":"Graph shortest path, Dijkstra, 0-1 BFS, DSU","core":"Networking timeouts; transaction rollback","dev":"Celery + Redis worker; jobs status, retries with backoff, idempotency key, failure tracking; avoid duplicate processing.","drill":"Simulate worker retry and duplicate delivery; prove Dijkstra nonnegative-weight assumption.","res":["celery","redis","postgres","cses"],"links":["d19","d20","b8","c0","c3"],"target":8,"extra":""},{"n":10,"title":"Data performance & release","dsa":"DP 1D/2D, grid, knapsack, subset sum","core":"Index selectivity, query plans, MVCC, isolation anomalies","dev":"SignalDesk v2: index query paths; record test load baseline, p95, error rate; structured logs, metrics, CI, release tag.","drill":"Compare EXPLAIN ANALYZE and latency before/after indexing; record hardware and workload.","res":["pgindex","k6","otel","prom","gha"],"links":["d21","b4","b11","c0","c7"],"target":8,"extra":""},{"n":11,"title":"Low-level design & new domain","dsa":"DP LIS, LCS, edit distance, sequence DP","core":"LLD: SOLID, Strategy, Factory, Adapter; UML class diagrams","dev":"Start ReserveFlow booking service; requirements, ERD, API spec, service/repository boundaries, state machine.","drill":"Implement inventory reservation state transitions and un let planTab='timeline';const planOpen=new Set();

const planCheck=(id,txt,sub='')=>`<label class="planrow"><input type="checkbox" data-plancheck="${id}" ${state.plan[id]?'checked':''}><span class="${state.plan[id]?'plancheckdone':''}">${esc(txt)}${sub?`<small>${esc(sub)}</small>`:''}</span></label>`;

function planJumps(ids){return `<div class="planlinks">${ids.map(id=>{const kind=id[0]==='d'?'dsa':id[0]==='c'?'core':'backend';const t=DATA[kind].find(x=>x.id===id);return t?`<button data-jump="${kind}" data-topic="${id}">${esc(t.name)} →</button>`:''}).join('')}</div>`}
function planWeek(w){const ids=['dsa','core','dev','drill'].map(k=>`plan-w${w.n}-${k}`),n=ids.filter(id=>state.plan[id]).length;return `<details class="planweek" data-planopen="w${w.n}" ${planOpen.has('w'+w.n)?'open':''}><summary><strong>Week ${w.n} · ${esc(w.title)}</strong><span class="tag">${w.target} new DSA</span><span class="tag ${n===4?'solved':''}">${n}/4</span></summary>${planCheck(ids[0],w.dsa,`DSA target: ${w.target} unique new problems; revisit old ones separately.`)}${planCheck(ids[1],w.core,'Recall without notes; answer 3–5 interview questions.')}${planCheck(ids[2],w.dev,'Ship a small vertical slice; commit and test.')}${planCheck(ids[3],w.drill,'Implement independently, then compare or ask for review.')}${w.extra?`<p>${esc(w.extra)}</p>`:''}<h4>Study & code resources</h4>${planRefs(w.res.join(' '))}<h4>Open your existing checklists</h4>${planJumps(w.links)}</details>`}
function planMilestone(m){const ids=[...m.features.map((_,i)=>`plan-${m.id}-f${i}`),...m.gate.map((_,i)=>`plan-${m.id}-g${i}`)],n=ids.filter(id=>state.plan[id]).length;return `<section class="panel plansection"><div class="panelhead"><div><div class="eyebrow">${m.id.toUpperCase()} · ${esc(m.when)}</div><h2>${esc(m.title)}</h2></div><div class="planprogress">${bar(n,ids.length,true)}<small>${n}/${ids.length} release checks</small></div></div><div class="planproject"><div class="eyebrow">Portfolio release</div><h3>${esc(m.project)}</h3><p class="planmuted">${esc(m.stack)}</p><p>${esc(m.scope)}</p><div class="architecture">${esc(m.architecture)}</div><h4>Build checklist</h4>${m.features.map((x,i)=>planCheck(`plan-${m.id}-f${i}`,x)).join('')}<h4>Exit gate · evidence required</h4>${m.gate.map((x,i)=>planCheck(`plan-${m.id}-g${i}`,x)).join('')}<p class="resume"><strong>Resume direction (not a completed claim):</strong> ${esc(m.resume)}</p>${planRefs(m.refs)}</div>${PLAN.weeks.filter(w=>w.n>=m.weeks[0]&&w.n<=m.weeks[1]).map(planWeek).join('')}</section>`}
function planRoutine(){return `<section class="panel plansection"><h2>Time budget & prioritization</h2><p class="muted">Start on your chosen Day 1. First 40 days: 80–120 hours at 2–3 hours/day. After classes: planning assumption of ~6–9 hours/week (adjust pace during exams). Weeks 7–24 are a rolling sequence, not a deadline; extend if your available hours fall.</p><div class="dashgrid sectiongap"><div class="planproject"><h3>40-day intensive · 150 min example</h3><p>65 min DSA (one new medium or two easier + review) · 65 min backend/project · 20 min CS recall/SQL. At 120 min: 50/55/15. At 180 min: 80/75/25. One lighter review day per week. Finish existing assignment first if deadlines overlap.</p></div><div class="planproject"><h3>After classes · sustainable week</h3><p>4 weekdays × 45–60 min: alternate DSA + CS and project; weekend 2 × 90–150 min: project release, mock and revision. During exams: 20 min recall or rest, resume from last incomplete week. Apply early; don't wait for all milestones.</p></div></div><h3 style="margin-top:16px">First 40 days · practical schedule</h3>${PLAN.days.map(([day,txt])=>`<div class="planrow"><strong style="width:83px;flex:none">Day ${esc(day)}</strong><span>${esc(txt)}</span></div>`).join('')}<h3 style="margin-top:16px">Mastery rules</h3><p class="muted">Attempt unseen problem 20–35 min; request a hint, not solution; reimplement closed-book; record complexity and error. Revise +2/+7/+21 days via the existing revision tab. Count distinct problem URLs, not repeated pattern entries. At least 70% of practice should be independently solvable at the end; use actual timed results, not checkbox totals. Learn concept → implement small exercise → test → explain → integrate.</p></section>`}
function planInterview(){return `<section class="panel plansection"><h2>Off-campus hiring playbook</h2><p class="muted">Primary: SDE I / Graduate SWE / backend-focused full-stack / internship-to-PPO. Secondary: cloud/platform junior roles where skills fit. Retain campus placement and aptitude preparation as insurance. Apply to product companies, funded startups and strong engineering teams; eligibility and pay vary. Target ₹25 LPA total compensation, not guaranteed base salary or offer. Compare fixed pay, variable, annual equity vesting, joining bonus, location, bond and learning.</p><div class="planproject"><h3>Application cadence</h3><p>Weeks 1–6: build baseline CV, LinkedIn, GitHub, campus eligibility; watch openings and apply to eligible time-sensitive roles. Weeks 7–14: aim 5–8 tailored applications/week, 2–3 relevant alumni/referral conversations, one mock every 1–2 weeks. Weeks 15–24: aim 8–12 applications/week, 1–2 mocks/week if schedule allows. Review funnel every two weeks; improve CV if no screens, coding if OAs fail, explanation/design if interviews fail.</p><p>Prepare 6–8 STAR stories: ownership, difficult bug, failure/learning, conflict, teamwork, deadline, ambiguity and impact. Use real project/class examples. Campus aptitude: quantitative, reasoning, verbal and timed practice.</p>${planRefs('amz ms apt jobs wellfound amazonjobs msjobs googlejobs')}</div><div class="planproject"><h3>Readiness gates (targets, not hiring promises)</h3><p>180–200 unique high-quality DSA problems by week 24 (weekly target sum ${PLAN.weeks.reduce((a,w)=>a+w.target,0)}); 40–60 SQL drills; 12+ timed OAs; 8–12 coding mocks; 5–8 design/LLD mocks. Finish 2–3 independent or substantially extended repos. Repeatedly solve unseen medium within ~30–40 min with clean code, tests and complexity. Explain DB isolation, OS concurrency, HTTP/TLS, OOP and project trade-offs without notes.</p><p>Priorities: P0 DSA + backend fundamentals + CS core + resume/applications; P1 React/TS, Redis/queues, deployment, LLD/HLD; P2 optional Django, Kafka, Kubernetes, Terraform and deeper ML only when useful. COA/TOC/compiler basics for campus-specific rounds. Avoid parallel stacks, credential collecting and tutorial copying.</p></div><h3 style="margin-top:16px">Application tracker</h3><form id="planAppForm" class="planlog sectiongap"><input name="company" placeholder="Company" required maxlength="200"><input name="role" placeholder="Role / requisition" required maxlength="200"><input name="url" type="url" placeholder="Posting URL (optional)"><select name="status">${['Wishlist','Applied','Referral requested','OA','Interview','Offer','Rejected','Closed'].map(x=>`<option>${x}</option>`).join('')}</select><input type="date" name="date" value="${today()}"><button type="submit" class="primary">Add application</button><textarea name="notes" maxlength="4000" placeholder="Referral, compensation breakdown, next step, deadline or feedback"></textarea></form><div class="planloglist">${state.applications.length?state.applications.map((x,i)=>`<div class="planrow"><span><strong>${esc(x.company)} · ${esc(x.role)}</strong><small>${esc(x.date)} · ${esc(x.notes)}</small>${/^https?:\/\//i.test(x.url)?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Posting ↗</a>`:''}</span><select aria-label="Application status" data-appstatus="${i}">${['Wishlist','Applied','Referral requested','OA','Interview','Offer','Rejected','Closed'].map(v=>opt(v,v,x.status)).join('')}</select><button data-appdelete="${i}" aria-label="Remove application">Remove</button></div>`).join(''):'<p class="muted">No applications yet. Add a role when you find one.</p>'}</div></section>`}
function planResources(){const groups=[['DSA & coding','cpp learncpp lc neetcode cses cf sql sqlbolt'],['Python, APIs, database & tests','python async typing git linux ruff uv http fastapi pydantic postgres pgindex sa alembic pytest security cheats'],['Frontend & cloud','js css react ts docker gha aws awsarch cost'],['Production & design','redis celery k6 otel prom django drf os db cn lld hld sre kafka tf k8s'],['ML & hiring','ml mlflow amz ms github jobs wellfound amazonjobs msjobs googlejobs apt']];return `<section class="panel plansection"><h2>Curated resource library</h2><p class="muted">Start with one resource per topic; read the relevant section, code a small example, and return to the milestone. Official docs and free practice are preferred; some platforms offer paid features. Links require internet; availability and paths may change.</p>${groups.map(([name,keys])=>`<h3 style="margin:16px 0 7px">${esc(name)}</h3><div class="planresource">${keys.split(' ').map(k=>`<a href="${esc(PLAN.resources[k][1])}" target="_blank" rel="noopener noreferrer">${esc(PLAN.resources[k][0])} ↗</a>`).join('')}</div>`).join('')}</section>`}
function planTutor(){return `<section class="panel plansection"><h2>Learn with ChatGPT instead of a tutorial</h2><p class="muted">Copy a prompt into your ChatGPT conversation and replace placeholders. This standalone HTML does not connect to an AI service, execute your code or automatically sync quiz results; manually log progress here. Use official docs to verify API details and run your own tests.</p>${PLAN.tutor.map(([name,prompt],i)=>`<div class="planproject"><h3>${esc(name)}</h3><textarea readonly class="plantext" id="tutor-${i}">${esc(prompt)}</textarea><button data-tutorcopy="${i}">Copy prompt</button></div>`).join('')}</section>`}
function renderPlan(){const n=planCompleted(),total=planIds().length;const count=PLAN.weeks.reduce((a,w)=>a+w.target,0);app.innerHTML=heading('Personalized · off-campus preparation','Your SDE roadmap','Backend-focused software engineering with cloud and applied AI depth. C++ for DSA, Python for backend, React/TypeScript for practical full-stack delivery.')+`<section class="planhero"><div><div class="eyebrow">Target · ₹25 LPA+ CTC</div><h2>Build proof, not just a skill list.</h2><p>Third-year CSE · 40-day intensive, then a flexible 24-week path. Use existing C++/Python/Flask, AWS, SQL, networks and ML experience; focus on independence, correctness, deployment and interview performance. Keep campus backup. Compensation is a target, not a promise.</p><div class="hero-actions"><button class="primary" data-plantab="timeline">Milestones →</button><button data-plantab="routine">40-day plan</button><button data-plantab="interview">Hiring tracker</button></div></div><div class="planmetrics"><div class="planmetric"><strong>24</strong><small>weeks · flexible</small></div><div class="planmetric"><strong>${count}</strong><small>unique DSA target</small></div><div class="planmetric"><strong>3</strong><small>flagship projects · 6 releases</small></div><div class="planmetric"><strong>${pct(n,total)}%</strong>${bar(n,total,true)}<small>${n}/${total} roadmap checks</small></div></div></section><div class="plansticky" role="navigation" aria-label="Roadmap sections">${[['timeline','Milestones & weeks'],['routine','40 days & routine'],['resources','Resource library'],['tutor','Learn with ChatGPT'],['interview','Hiring & applications']].map(([id,name])=>`<button class="${planTab===id?'active':''}" data-plantab="${id}">${name}</button>`).join('')}</div>`+(planTab==='timeline'?`<p class="planmuted">Check weekly outcomes only after demonstrating them. Use the linked catalog for currently supplied DSA topics and problem status. Topics not yet supplied have no question list; weekly targets remain unchanged. Project releases deliberately build on each other; no need to create six separate repositories.</p>${PLAN.milestones.map(planMilestone).join('')}`:planTab==='routine'?planRoutine():planTab==='resources'?planResources():planTab==='tutor'?planTutor():planInterview());}
document.addEventListener('toggle',e=>{const k=e.target.dataset?.planopen;if(k&&e.target.isConnected){e.target.open?planOpen.add(k):planOpen.delete(k)}},true);
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.plancheck){state.plan[el.dataset.plancheck]=el.checked;save();renderPlan();return}if(el.dataset.appstatus!==undefined){const x=state.applications[Number(el.dataset.appstatus)];if(x){x.status=el.value;save();renderPlan()}}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.plantab){planTab=b.dataset.plantab;renderPlan();return}if(b.dataset.appdelete!==undefined){if(confirm('Remove this application?')){state.applications.splice(Number(b.dataset.appdelete),1);save();renderPlan()}return}if(b.dataset.tutorcopy!==undefined){const t=$('#tutor-'+b.dataset.tutorcopy);try{await navigator.clipboard.writeText(t.value);notify('Prompt copied')}catch(err){t.focus();t.select();try{if(document.execCommand('copy'))notify('Prompt copied');else notify('Prompt selected — press Ctrl+C / Cmd+C')}catch(e){notify('Prompt selected — press Ctrl+C / Cmd+C')}}}});
document.addEventListener('submit',e=>{if(e.target.id==='planAppForm'){e.preventDefault();const v=Object.fromEntries(new FormData(e.target));state.applications.push(v);save();renderPlan();notify('Application added')}});

$('#todayLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});theme();render();
</script></body></html>
