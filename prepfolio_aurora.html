/* Aurora: accessible disclosure and checkbox interactions */
:root{--check-fill:#56dcb2;--check-ink:#092b25;--check-border:#53627d;--check-empty:#182237;--check-glow:#55deb32c}
html.light{--check-fill:#16866a;--check-ink:#fff;--check-border:#a4afc5;--check-empty:#f7f9fe;--check-glow:#16866a23}
input[type="checkbox"]{-webkit-appearance:none;appearance:none;display:inline-grid;place-items:center;vertical-align:middle;width:19px;height:19px;flex:none;margin:0;position:relative;cursor:pointer;border:1.5px solid var(--check-border);border-radius:6px;background:var(--check-empty);box-shadow:inset 0 1px 2px #00000016;transition:background .18s ease,border-color .18s ease,box-shadow .2s ease,transform .18s ease}
input[type="checkbox"]::after{content:'';display:block;width:5px;height:9px;border:solid var(--check-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg) scale(0);opacity:0;transition:transform .21s cubic-bezier(.2,.8,.25,1.4),opacity .15s ease}
input[type="checkbox"]:checked{background:var(--check-fill);border-color:var(--check-fill);box-shadow:0 0 10px var(--check-glow)}
input[type="checkbox"]:checked::after{transform:translateY(-1px) rotate(45deg) scale(1);opacity:1}
input[type="checkbox"]:indeterminate{background:var(--accent);border-color:var(--accent)}
input[type="checkbox"]:indeterminate::after{width:9px;height:2px;border:0;background:var(--bg);border-radius:2px;transform:none;opacity:1}
input[type="checkbox"]:hover:not(:disabled){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
input[type="checkbox"]:checked:hover:not(:disabled){border-color:var(--check-fill);box-shadow:0 0 0 3px var(--check-glow)}
input[type="checkbox"]:active:not(:disabled){transform:scale(.9)}
input[type="checkbox"]:disabled{opacity:.45;cursor:not-allowed}
input[type="checkbox"]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
input[data-pattern]{width:17px;height:17px;border-radius:5px}
input[data-pattern]:checked{background:var(--accent);border-color:var(--accent)}
input[data-pattern]:checked::after{border-color:var(--bg)}
.planrow input[type="checkbox"]{margin-top:3px}
@keyframes auroraCheckPop{0%{transform:scale(.85)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes auroraCheckDraw{0%{transform:translateY(-1px) rotate(45deg) scale(0);opacity:0}100%{transform:translateY(-1px) rotate(45deg) scale(1);opacity:1}}
input.aurora-check-pop{animation:auroraCheckPop .27s cubic-bezier(.2,.8,.25,1) both}
input.aurora-check-pop:checked::after{animation:auroraCheckDraw .23s .025s both}
.topiccard>summary,.pattern>summary,.planweek>summary{transition:background .22s ease,color .22s ease,border-color .22s ease; -webkit-tap-highlight-color:transparent}
.topiccard[open]>summary,.pattern[open]>summary{background:linear-gradient(90deg,#a99bff0d,transparent 80%)}
.chevron{transition:transform .28s cubic-bezier(.22,1,.36,1),color .22s ease}
details.aurora-closing>summary>.chevron{transform:rotate(0deg)!important}
details.aurora-closing>summary{background:transparent}
.planweek.aurora-closing>summary::before{content:'▸'}
@media(forced-colors:active){input[type="checkbox"]{appearance:auto;-webkit-appearance:auto;accent-color:auto;box-shadow:none!important}input[type="checkbox"]::after{display:none}}

let planTab='timeline';const planOpen=new Set();
const planIds=()=>[...PLAN.weeks.flatMap(w=>['dsa','core','dev','drill'].map(k=>`plan-w${w.n}-${k}${k==='dev'||k==='drill'?'-node':''}`)),...PLAN.milestones.flatMap(m=>[...m.features.map((_,i)=>`plan-${m.id}-f${i}-node`),...m.gate.map((_,i)=>`plan-${m.id}-g${i}-node`)])];
const planCompleted=()=>planIds().filter(id=>state.plan[id]).length;
const planCheck=(id,txt,sub='')=>`<label class="planrow"><input type="checkbox" data-plancheck="${id}" ${state.plan[id]?'checked':''}><span class="${state.plan[id]?'plancheckdone':''}">${esc(txt)}${sub?`<small>${esc(sub)}</small>`:''}</span></label>`;
const planRefs=keys=>`<div class="planlinks">${keys.split(' ').filter(k=>PLAN.resources[k]).map(k=>`<a href="${esc(PLAN.resources[k][1])}" target="_blank" rel="noopener noreferrer">${esc(PLAN.resources[k][0])} ↗</a>`).join('')}</div>`;
function planJumps(ids){return `<div class="planlinks">${ids.map(id=>{const kind=id[0]==='d'?'dsa':id[0]==='c'?'core':'backend';const t=DATA[kind].find(x=>x.id===id);return t?`<button data-jump="${kind==='backend'?t.track:kind}" data-topic="${id}">${esc(t.name)} →</button>`:''}).join('')}</div>`}
function planWeek(w){const ids=['dsa','core','dev','drill'].map(k=>`plan-w${w.n}-${k}${k==='dev'||k==='drill'?'-node':''}`),n=ids.filter(id=>state.plan[id]).length;return `<details class="planweek" data-planopen="w${w.n}" ${planOpen.has('w'+w.n)?'open':''}><summary><strong>Week ${w.n} · ${esc(w.title)}</strong><span class="tag">${w.target} new DSA</span><span class="tag ${n===4?'solved':''}">${n}/4</span></summary>${planCheck(ids[0],w.dsa,`DSA target: ${w.target} unique new problems; revisit old ones separately.`)}${planCheck(ids[1],w.core,'Recall without notes; answer 3–5 interview questions.')}${planCheck(ids[2],w.dev,'Ship a small vertical slice; commit and test.')}${planCheck(ids[3],w.drill,'Implement independently, then compare or ask for review.')}${w.extra?`<p>${esc(w.extra)}</p>`:''}<h4>Study & code resources</h4>${planRefs(w.res.join(' '))}<h4>Open your existing checklists</h4>${planJumps(w.links)}</details>`}
function planMilestone(m){const ids=[...m.features.map((_,i)=>`plan-${m.id}-f${i}-node`),...m.gate.map((_,i)=>`plan-${m.id}-g${i}-node`)],n=ids.filter(id=>state.plan[id]).length;return `<section class="panel plansection"><div class="panelhead"><div><div class="eyebrow">${m.id.toUpperCase()} · ${esc(m.when)}</div><h2>${esc(m.title)}</h2></div><div class="planprogress">${bar(n,ids.length,true)}<small>${n}/${ids.length} release checks</small></div></div><div class="planproject"><div class="eyebrow">Portfolio release</div><h3>${esc(m.project)}</h3><p class="planmuted">${esc(m.stack)}</p><p>${esc(m.scope)}</p><div class="architecture">${esc(m.architecture)}</div><h4>Build checklist</h4>${m.features.map((x,i)=>planCheck(`plan-${m.id}-f${i}-node`,x)).join('')}<h4>Exit gate · evidence required</h4>${m.gate.map((x,i)=>planCheck(`plan-${m.id}-g${i}-node`,x)).join('')}<p class="resume"><strong>Resume direction (not a completed claim):</strong> ${esc(m.resume)}</p>${planRefs(m.refs)}</div>${PLAN.weeks.filter(w=>w.n>=m.weeks[0]&&w.n<=m.weeks[1]).map(planWeek).join('')}</section>`}
function planRoutine(){return `<section class="panel plansection"><h2>Time budget & prioritization</h2><p class="muted">Start on your chosen Day 1. First 40 days: 80–120 hours at 2–3 hours/day. After classes: planning assumption of ~6–9 hours/week (adjust pace during exams). Weeks 7–24 are a rolling sequence, not a deadline; extend if your available hours fall.</p><div class="dashgrid sectiongap"><div class="planproject"><h3>40-day intensive · 150 min example</h3><p>65 min DSA (one new medium or two easier + review) · 65 min Node/backend project (include small Python model-service tasks only as needed) · 20 min CS recall/SQL. At 120 min: 50/55/15. At 180 min: 80/75/25. One lighter review day per week. Finish existing assignment first if deadlines overlap.</p></div><div class="planproject"><h3>After classes · sustainable week</h3><p>4 weekdays × 45–60 min: alternate DSA + CS and project; weekend 2 × 90–150 min: project release, mock and revision. During exams: 20 min recall or rest, resume from last incomplete week. Apply early; don't wait for all milestones.</p></div></div><h3 style="margin-top:16px">First 40 days · practical schedule</h3>${PLAN.days.map(([day,txt])=>`<div class="planrow"><strong style="width:83px;flex:none">Day ${esc(day)}</strong><span>${esc(txt)}</span></div>`).join('')}<h3 style="margin-top:16px">Mastery rules</h3><p class="muted">Attempt unseen problem 20–35 min; request a hint, not solution; reimplement closed-book; record complexity and error. Revise +2/+7/+21 days via the existing revision tab. Count distinct problem URLs, not repeated pattern entries. At least 70% of practice should be independently solvable at the end; use actual timed results, not checkbox totals. Learn concept → implement small exercise → test → explain → integrate.</p></section>`}
function planInterview(){return `<section class="panel plansection"><h2>Off-campus hiring playbook</h2><p class="muted">Primary: SDE I / Graduate SWE / backend-focused full-stack / internship-to-PPO. Secondary: cloud/platform junior roles where skills fit. Retain campus placement and aptitude preparation as insurance. Apply to product companies, funded startups and strong engineering teams; eligibility and pay vary. Target ₹25 LPA total compensation, not guaranteed base salary or offer. Compare fixed pay, variable, annual equity vesting, joining bonus, location, bond and learning.</p><div class="planproject"><h3>Application cadence</h3><p>Weeks 1–6: build baseline CV, LinkedIn, GitHub, campus eligibility; watch openings and apply to eligible time-sensitive roles. Weeks 7–14: aim 5–8 tailored applications/week, 2–3 relevant alumni/referral conversations, one mock every 1–2 weeks. Weeks 15–24: aim 8–12 applications/week, 1–2 mocks/week if schedule allows. Review funnel every two weeks; improve CV if no screens, coding if OAs fail, explanation/design if interviews fail.</p><p>Prepare 6–8 STAR stories: ownership, difficult bug, failure/learning, conflict, teamwork, deadline, ambiguity and impact. Use real project/class examples. Campus aptitude: quantitative, reasoning, verbal and timed practice.</p>${planRefs('amz ms apt jobs wellfound amazonjobs msjobs googlejobs')}</div><div class="planproject"><h3>Readiness gates (targets, not hiring promises)</h3><p>180–200 unique high-quality DSA problems by week 24 (weekly target sum ${PLAN.weeks.reduce((a,w)=>a+w.target,0)}); 40–60 SQL drills; 12+ timed OAs; 8–12 coding mocks; 5–8 design/LLD mocks. Finish 2–3 independent or substantially extended repos. Repeatedly solve unseen medium within ~30–40 min with clean code, tests and complexity. Explain DB isolation, OS concurrency, HTTP/TLS, OOP and project trade-offs without notes.</p><p>Priorities: P0 DSA + backend fundamentals + CS core + resume/applications; P1 React/TS, Redis/queues, deployment, LLD/HLD; P2 optional Django, Kafka, Kubernetes, Terraform and deeper ML only when useful. COA/TOC/compiler basics for campus-specific rounds. Avoid parallel stacks, credential collecting and tutorial copying.</p></div><h3 style="margin-top:16px">Application tracker</h3><form id="planAppForm" class="planlog sectiongap"><input name="company" placeholder="Company" required maxlength="200"><input name="role" placeholder="Role / requisition" required maxlength="200"><input name="url" type="url" placeholder="Posting URL (optional)"><select name="status">${['Wishlist','Applied','Referral requested','OA','Interview','Offer','Rejected','Closed'].map(x=>`<option>${x}</option>`).join('')}</select><input type="date" name="date" value="${today()}"><button type="submit" class="primary">Add application</button><textarea name="notes" maxlength="4000" placeholder="Referral, compensation breakdown, next step, deadline or feedback"></textarea></form><div class="planloglist">${state.applications.length?state.applications.map((x,i)=>`<div class="planrow"><span><strong>${esc(x.company)} · ${esc(x.role)}</strong><small>${esc(x.date)} · ${esc(x.notes)}</small>${/^https?:\/\//i.test(x.url)?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Posting ↗</a>`:''}</span><select aria-label="Application status" data-appstatus="${i}">${['Wishlist','Applied','Referral requested','OA','Interview','Offer','Rejected','Closed'].map(v=>opt(v,v,x.status)).join('')}</select><button data-appdelete="${i}" aria-label="Remove application">Remove</button></div>`).join(''):'<p class="muted">No applications yet. Add a role when you find one.</p>'}</div></section>`}
function planResources(){const groups=[['DSA & coding','cpp learncpp lc neetcode cses cf sql sqlbolt'],['Node.js backend','js ts node npm express nest zod prisma postgres pgindex vitest supertest testcontainers security cheats redis bull'],['Cloud with Python','python typing uv boto cdk iam ecs aws awsarch cost tf'],['DevOps & reliability','git linux nginx docker gha oteljs otel prom k6 sre k8s'],['AI/ML integration','fastapi pydantic pytest ml mlflow'],['CS, design & optional frontend','os db cn lld hld kafka react css'],['Hiring','amz ms github jobs wellfound amazonjobs msjobs googlejobs apt']];return `<section class="panel plansection"><h2>Curated resource library</h2><p class="muted">Start with one resource per topic; read the relevant section, code a small example, and return to the milestone. Official docs and free practice are preferred; some platforms offer paid features. Links require internet; availability and paths may change.</p>${groups.map(([name,keys])=>`<h3 style="margin:16px 0 7px">${esc(name)}</h3><div class="planresource">${keys.split(' ').map(k=>`<a href="${esc(PLAN.resources[k][1])}" target="_blank" rel="noopener noreferrer">${esc(PLAN.resources[k][0])} ↗</a>`).join('')}</div>`).join('')}</section>`}
function planTutor(){return `<section class="panel plansection"><h2>Learn with ChatGPT instead of a tutorial</h2><p class="muted">Copy a prompt into your ChatGPT conversation and replace placeholders. This standalone HTML does not connect to an AI service, execute your code or automatically sync quiz results; manually log progress here. Use official docs to verify API details and run your own tests.</p>${PLAN.tutor.map(([name,prompt],i)=>`<div class="planproject"><h3>${esc(name)}</h3><textarea readonly class="plantext" id="tutor-${i}">${esc(prompt)}</textarea><button data-tutorcopy="${i}">Copy prompt</button></div>`).join('')}</section>`}
function planTracks(){return `<section class="panel plansection"><h2>Four connected specializations</h2><p class="muted">Primary stack: Node.js/TypeScript. Python is for cloud automation and model-serving, not a parallel full backend curriculum. Follow the weekly plan for scheduling; this catalog is a reference, not a 40-day completion requirement.</p><div class="dashgrid sectiongap">${Object.entries(TRACKS).map(([k,t])=>{const a=trackSkills(k),n=a.filter(x=>status(x.id,'backend')==='Studied').length;return `<article class="planproject"><div class="eyebrow">${k==='backend'?'Primary · 60%':k==='cloud'?'Cloud · 15%':k==='devops'?'DevOps · 10%':'Python AI/ML · 15%'}</div><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p>${bar(n,a.length,true)}<p class="muted">${n}/${a.length} skills completed</p><button class="primary" data-view="${k}">Open checklist →</button></article>`}).join('')}</div><p class="info sectiongap">Percentages apply only to development time across the full roadmap, not DSA or CS study time. Prioritize Node fundamentals during the first 40 days. Learn advanced tooling only as milestones require it.</p><div class="planproject"><h3>Progress migration</h3><p>Existing DSA, CS core, bookmarks and unchanged development skill IDs are preserved. Replaced Python application topics and previous release/development checks remain in imported JSON backups but are not credited as completed in the new stack. Use Backup in the old file, then Import here if your browser does not share local storage.</p></div></section>`}
function renderPlan(){const n=planCompleted(),total=planIds().length;const count=PLAN.weeks.reduce((a,w)=>a+w.target,0);app.innerHTML=heading('Personalized · off-campus preparation','Your SDE roadmap','Backend Software Engineer with Cloud, DevOps and AI/ML integration capabilities. C++ for DSA, Node.js/TypeScript for backend, Python for cloud automation and model serving.')+`<section class="planhero"><div><div class="eyebrow">Target · ₹25 LPA+ CTC</div><h2>Backend Software Engineer with Cloud, DevOps and AI/ML integration capabilities.</h2><p>Third-year CSE · 40-day intensive, then a flexible 24-week path. Use existing C++, Python, AWS, SQL, networks and ML experience; learn Node.js/TypeScript as your primary application stack; focus on independence, correctness, deployment and interview performance. Keep campus backup. Compensation is a target, not a promise.</p><div class="hero-actions"><button class="primary" data-plantab="timeline">Milestones →</button><button data-plantab="routine">40-day plan</button><button data-plantab="interview">Hiring tracker</button></div></div><div class="planmetrics"><div class="planmetric"><strong>24</strong><small>weeks · flexible</small></div><div class="planmetric"><strong>${count}</strong><small>unique DSA target</small></div><div class="planmetric"><strong>3</strong><small>flagship projects · 6 releases</small></div><div class="planmetric"><strong>${pct(n,total)}%</strong>${bar(n,total,true)}<small>${n}/${total} roadmap checks</small></div></div></section><div class="plansticky" role="navigation" aria-label="Roadmap sections">${[['timeline','Milestones & weeks'],['tracks','Separate learning tracks'],['routine','40 days & routine'],['resources','Resource library'],['tutor','Learn with ChatGPT'],['interview','Hiring & applications']].map(([id,name])=>`<button class="${planTab===id?'active':''}" data-plantab="${id}">${name}</button>`).join('')}</div>`+(planTab==='timeline'?`<p class="planmuted">Check weekly outcomes only after demonstrating them. Use the linked catalog for currently supplied DSA topics and problem status. Topics not yet supplied have no question list; weekly targets remain unchanged. Project releases deliberately build on each other; no need to create six separate repositories.</p>${PLAN.milestones.map(planMilestone).join('')}`:planTab==='tracks'?planTracks():planTab==='routine'?planRoutine():planTab==='resources'?planResources():planTab==='tutor'?planTutor():planInterview());}
document.addEventListener('toggle',e=>{const k=e.target.dataset?.planopen;if(k&&e.target.isConnected){e.target.open?planOpen.add(k):planOpen.delete(k)}},true);
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.plancheck){state.plan[el.dataset.plancheck]=el.checked;save();renderPlan();return}if(el.dataset.appstatus!==undefined){const x=state.applications[Number(el.dataset.appstatus)];if(x){x.status=el.value;save();renderPlan()}}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.plantab){planTab=b.dataset.plantab;renderPlan();return}if(b.dataset.appdelete!==undefined){if(confirm('Remove this application?')){state.applications.splice(Number(b.dataset.appdelete),1);save();renderPlan()}return}if(b.dataset.tutorcopy!==undefined){const t=$('#tutor-'+b.dataset.tutorcopy);try{await navigator.clipboard.writeText(t.value);notify('Prompt copied')}catch(err){t.focus();t.select();try{if(document.execCommand('copy'))notify('Prompt copied');else notify('Prompt selected — press Ctrl+C / Cmd+C')}catch(e){notify('Prompt selected — press Ctrl+C / Cmd+C')}}}});
document.addEventListener('submit',e=>{if(e.target.id==='planAppForm'){e.preventDefault();const v=Object.fromEntries(new FormData(e.target));state.applications.push(v);save();renderPlan();notify('Application added')}});

// Aurora effects: Web Animations + Canvas 2D perspective projection. Independent of tracker state.
(()=>{
 const root=document.documentElement, reduced=matchMedia('(prefers-reduced-motion: reduce)');
 let preference=true;try{preference=localStorage.getItem('prepfolio-aurora-motion')!=='off'}catch(e){}
 const enabled=()=>preference&&!reduced.matches;
 const toggle=document.querySelector('[data-aurora-motion]');
 let canvas=null,frame=0,lastView='', lastPlan='', context=null, size=[0,0], started=0;
 const nodes=Array.from({length:62},(_,i)=>{const y=1-2*(i+.5)/62, a=i*2.39996323, r=Math.sqrt(1-y*y);return [r*Math.cos(a),y,r*Math.sin(a)]});
 const links=[];for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];if(Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])<.53)links.push([i,j])}
 function stop(){if(frame)cancelAnimationFrame(frame);frame=0;}
 function draw(ts){frame=0;if(!enabled()||document.hidden||!canvas?.isConnected)return;const rect=canvas.getBoundingClientRect();if(rect.bottom<0||rect.top>innerHeight){frame=requestAnimationFrame(draw);return}const dpr=Math.min(devicePixelRatio||1,2),w=rect.width,h=rect.height;if(!w||!h)return;if(size[0]!==w*dpr||size[1]!==h*dpr){size=[w*dpr,h*dpr];canvas.width=Math.round(size[0]);canvas.height=Math.round(size[1])}const c=context;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);const t=(ts-started)*.00024, a=Math.cos(t),b=Math.sin(t),R=Math.min(w*.38,h*.56),cx=w*.70,cy=h*.50;const points=nodes.map(([x,y,z])=>{let X=x*a+z*b,Z=z*a-x*b,Y=y*.93-Z*.36;Z=y*.36+Z*.93;let k=3.7/(3.7-Z);return [cx+X*R*k,cy+Y*R*k,Z,k]});const light=root.classList.contains('light');for(const [i,j] of links){let p=points[i],q=points[j];c.strokeStyle=`rgba(${light?'91,70,180':'146,160,255'},${.10+(p[2]+q[2]+2)*.055})`;c.lineWidth=.8;c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(q[0],q[1]);c.stroke()}for(const p of points){c.fillStyle=`rgba(${light?'68,63,170':'141,216,255'},${.22+(p[2]+1)*.34})`;c.beginPath();c.arc(p[0],p[1],1.55*p[3],0,Math.PI*2);c.fill()}frame=requestAnimationFrame(draw)}
 function attach(){const hero=app.querySelector('.hero,.planhero');if(canvas?.isConnected&&canvas.parentElement===hero){if(enabled()&&!frame&&!document.hidden){started=performance.now();frame=requestAnimationFrame(draw)}return}stop();canvas=null;if(!hero||!enabled())return;canvas=document.createElement('canvas');canvas.className='orbit-canvas';canvas.setAttribute('aria-hidden','true');hero.prepend(canvas);context=canvas.getContext('2d');size=[0,0];started=performance.now();if(context&&!document.hidden)frame=requestAnimationFrame(draw)}
 function configure(){root.classList.toggle('motion-off',!enabled());toggle.setAttribute('aria-pressed',String(enabled()));toggle.textContent=enabled()?'✧ Motion':'✧ Off';toggle.title=reduced.matches?'Motion disabled by system accessibility setting':enabled()?'Turn motion effects off':'Turn motion effects on';if(!enabled())stop();else attach()}
 toggle.addEventListener('click',()=>{preference=!preference;try{localStorage.setItem('prepfolio-aurora-motion',preference?'on':'off')}catch(e){}configure()});reduced.addEventListener?.('change',configure);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else attach()});
 function animatePage(){attach();const current=view, tab=current==='plan'?planTab:'';if(current===lastView&&tab===lastPlan)return;lastView=current;lastPlan=tab;if(!enabled())return;const items=[...app.querySelectorAll('.intro,.hero,.planhero,.stats .stat,.dashgrid>.panel,.topiclist>.topiccard,.plansticky,.plansection')].slice(0,12);items.forEach((el,i)=>el.animate([{opacity:0,transform:'translateY(9px)'},{opacity:1,transform:'translateY(0)'}],{duration:300,delay:Math.min(i*25,140),easing:'cubic-bezier(.2,.7,.2,1)',fill:'backwards'}));app.querySelectorAll('.bar>span').forEach(el=>{if(el.getBoundingClientRect().top<innerHeight)el.animate([{transform:'scaleX(0)',transformOrigin:'left'},{transform:'scaleX(1)',transformOrigin:'left'}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)'})});}
 let scheduled=false;new MutationObserver(()=>{if(!scheduled){scheduled=true;requestAnimationFrame(()=>{scheduled=false;animatePage()})}}).observe(app,{childList:true});
 document.addEventListener('pointermove',e=>{if(!enabled()||e.pointerType==='touch')return;const card=e.target.closest('.stat');if(!card)return;const r=card.getBoundingClientRect();card.style.setProperty('--mx',`${e.clientX-r.left}px`);card.style.setProperty('--my',`${e.clientY-r.top}px`)});
 document.addEventListener('change',e=>{const el=e.target;if(!enabled()||!el.matches('input[data-check][data-kind="problems"]:checked'))return;const r=el.getBoundingClientRect();for(let i=0;i<9;i++){const p=document.createElement('i');p.className='spark';p.setAttribute('aria-hidden','true');p.style.left=`${r.left+r.width/2}px`;p.style.top=`${r.top+r.height/2}px`;p.style.background=i%3===0?'var(--accent)':i%3===1?'var(--cyan)':'var(--green)';document.body.append(p);const a=i*2*Math.PI/9,d=25+(i%3)*10;const anim=p.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(140deg) scale(.2)`,opacity:0}],{duration:420,easing:'ease-out'});anim.onfinish=()=>p.remove();anim.oncancel=()=>p.remove()}},true);
 configure();animatePage();
})();


/* Smooth native details, without changing question data or tracking state. */
(()=>{
 const active=new Map(), reduced=matchMedia('(prefers-reduced-motion: reduce)');
 const motion=()=>!document.documentElement.classList.contains('motion-off')&&!reduced.matches;
 const selector='details.topiccard,details.pattern,details.planweek';
 function finish(d,target){
   const job=active.get(d);if(job){active.delete(d);job.animation.cancel()}
   d.open=target;d.classList.remove('aurora-closing');d.style.removeProperty('height');d.style.removeProperty('overflow');d.style.removeProperty('will-change');
 }
 function animateDisclosure(d){
   const previous=active.get(d), target=previous?!previous.target:!d.open;
   // Nested disclosures should not fight a moving parent's height.
   for(const [other,job] of [...active])if(other!==d&&(other.contains(d)||d.contains(other)))finish(other,job.target);
   if(!motion()||typeof d.animate!=='function'){finish(d,target);return}
   const start=d.getBoundingClientRect().height;
   if(previous){active.delete(d);previous.animation.cancel()}
   d.style.removeProperty('height');d.style.removeProperty('overflow');
   d.open=target;
   const end=d.getBoundingClientRect().height;
   // Keep the native content visible while closing; only commit closed at the end.
   d.open=true;
   d.classList.toggle('aurora-closing',!target);
   if(Math.abs(start-end)<1){finish(d,target);return}
   d.style.height=`${start}px`;d.style.overflow='hidden';d.style.willChange='height';
   const animation=d.animate([{height:`${start}px`},{height:`${end}px`}],{duration:Math.min(430,Math.max(230,220+Math.abs(start-end)*.08)),easing:'cubic-bezier(.22,1,.36,1)',fill:'both'});
   const job={animation,target};active.set(d,job);
   animation.onfinish=()=>{if(active.get(d)===job)finish(d,target)};
 }
 document.addEventListener('click',e=>{
   const summary=e.target.closest('summary');if(!summary||e.defaultPrevented||e.target.closest('input,button,a,select,textarea,label'))return;
   const d=summary.parentElement;if(!d.matches(selector))return;
   e.preventDefault();animateDisclosure(d);
 });
 // Preserve existing native expand/collapse-all actions and finish running motion before them.
 document.addEventListener('click',e=>{
   if(e.target.closest('[data-action="expand"],[data-action="collapse"],[data-aurora-motion]'))for(const [d,job] of [...active])finish(d,job.target);
 },true);
 reduced.addEventListener?.('change',()=>{if(!motion())for(const [d,job] of [...active])finish(d,job.target)});
 // Tracking renders replace the clicked input; replay the check animation on its replacement.
 document.addEventListener('change',e=>{
   const old=e.target;if(!old.matches('input[type="checkbox"]'))return;
   const key=['data-check','data-pattern','data-plancheck'].find(k=>old.hasAttribute(k));
   const value=key?old.getAttribute(key):null,kind=old.getAttribute('data-kind'),focused=document.activeElement===old;
   // Commit disclosure state before an existing tracker handler rebuilds the list.
   for(const [d,job] of [...active]){finish(d,job.target);if(d.dataset.openId){job.target?opened.add(d.dataset.openId):opened.delete(d.dataset.openId)}if(d.dataset.planopen){job.target?planOpen.add(d.dataset.planopen):planOpen.delete(d.dataset.planopen)}}
   queueMicrotask(()=>{
     const el=old.isConnected?old:key?[...document.querySelectorAll(`input[${key}]`)].find(x=>x.getAttribute(key)===value&&x.getAttribute('data-kind')===kind):null;
     if(!el)return;if(focused&&el!==old)el.focus({preventScroll:true});if(!motion())return;
     el.classList.remove('aurora-check-pop');void el.offsetWidth;el.classList.add('aurora-check-pop');
     el.addEventListener('animationend',()=>el.classList.remove('aurora-check-pop'),{once:true});
   });
 },true);
 // Drop animations when navigation/filtering removes their nodes.
 new MutationObserver(()=>{for(const [d,job] of active)if(!d.isConnected){active.delete(d);job.animation.cancel()}}).observe(document.getElementById('app'),{childList:true,subtree:true});
})();
